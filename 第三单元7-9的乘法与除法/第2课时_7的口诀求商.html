function quickScene(a,b,c,chant){const s=baseScene();s.decor=paper(300,42,900,540);s.annotation=T(750,106,'用7的乘法口诀求商',29,'muted')+E(505,290,a,'÷',b,c)+T(750,430,chant||`${b}乘几等于${a}？`,chant?51:40,'groups');s.description=`${a}÷${b}＝${c}。${chant||'答案尚未揭示。'}`;return s;}

const ringCenters=[{x:864,y:171},{x:1230,y:171},{x:864,y:449},{x:1230,y:449}];
const sunflower=(i,n,cx,cy,r)=>{const angle=i*2.399963229728653;const q=r*Math.sqrt((i+.5)/n);return{x:cx+Math.cos(angle)*q,y:cy+Math.sin(angle)*q*.88}};
function ringDecor(c,i){return `<circle cx="${c.x}" cy="${c.y+5}" r="83" fill="#c6b89225"/><circle cx="${c.x}" cy="${c.y}" r="78" fill="none" stroke="#65866d" stroke-width="10"/><circle cx="${c.x}" cy="${c.y}" r="72" fill="none" stroke="#99af79" stroke-width="3"/>`+T(c.x,c.y+132,`花环${i+1}`,29,'groups');}
function flowerScene(mode,count=0,board='',highlight=false){
 const s=baseScene();const avg=mode==='average';const moved=avg?count*4:count*7;
 s.decor=tray(26,55,630,540);
 s.annotation=T(340,38,count?`一共28朵 · 还剩${28-moved}朵`:'一共28朵花',29)+T(1038,46,avg?'4个花环 · 平均分':'每7朵扎1个花环',30,avg?'groups':'each');
 for(let j=0;j<(avg?4:count);j++)s.decor+=ringDecor(ringCenters[j],j);
 s.objects=Array.from({length:28},(_,i)=>{
  let p,scale=.90;
  if(avg){if(i<moved){const group=i%4,round=Math.floor(i/4);const a=-Math.PI/2+round*2*Math.PI/7;const c=ringCenters[group];p={x:c.x+Math.cos(a)*78,y:c.y+Math.sin(a)*78};scale=.80;}else p=sunflower(i,28,340,330,256);}
  else if(i<moved){const group=Math.floor(i/7),j=i%7,c=ringCenters[group],a=-Math.PI/2+j*2*Math.PI/7;p={x:c.x+Math.cos(a)*78,y:c.y+Math.sin(a)*78};scale=.80;}
  else p={x:88+(i%7)*83,y:163+Math.floor(i/7)*115};
  return object('flower',i,p.x,p.y,scale);
 });
 if(board){s.decor+=paper(55,125,571,420);s.annotation+=board;}else if(moved===28){s.annotation+=T(340,254,'花已经分完了',40)+T(340,381,avg?'每个花环几朵？':'一共有几个花环？',43,avg?'each':'groups');}
 if(highlight)for(let j=0;j<4;j++)s.annotation+=T(ringCenters[j].x,ringCenters[j].y+10,'7朵',29,'each');
 s.description=`同一批28朵花。${avg?`平均分4个花环，已完成${count}轮，各有${count}朵。`:`按每7朵一个花环，已扎${count}个。`}材料区剩${28-moved}朵。`;
 return s;
}

add(1,'flower-group-question','每7朵扎一个花环，可以扎几个花环？','先想怎么分',()=>flowerScene('groups',0),'先说总数28、每环7朵、求花环个数。图按四排七朵紧密摆放，但不标4份、不预先画4个花环。');

function textbookCenters(groups){

function textbookModel(kind,each,groups,grouped,board='',heading='想想做做',unit='个',highlight=false,knownTotal=true){

 }else{
  s.objects=Array.from({length:total},(_,i)=>{const g=Math.floor(i/each),j=i%each,c=cs[g];let x,y,scale;
   if(groups===1){x=c.x+(j-(each-1)/2)*89;y=c.y;scale=1.32;}

   else{const gap=groups<=2?69:groups===4?58:49;x=c.x+(j%4-1.5)*gap;y=c.y-31+Math.floor(j/4)*62;scale=groups<=2?1.12:groups===4?.96:.80;}
   return object(kind,i,x,y,scale);
  });
  cs.forEach((c,i)=>{const w=groups===1?750:groups<=2?310:groups===4?292:groups===7?200:232,h=groups===1?182:210;
   s.decor+=rect(c.x-w/2,c.y-h/2,w,h,'#fff4da',highlight&&i===0?'#247ca7':'#bda67f',18);
   s.annotation+=T(c.x,c.y+h/2+38,kind==='book'?`第${i+1}份`:`第${i+1}组`,25,'groups');

 }

function practiceDistribution(each,groups,mode,progress,solved=false){

 const centers=groups===1?[{x:1005,y:335}]:groups===5?[{x:725,y:210},{x:980,y:210},{x:1235,y:210},{x:850,y:460},{x:1105,y:460}]:[{x:630,y:210},{x:855,y:210},{x:1080,y:210},{x:1305,y:210},{x:742,y:460},{x:967,y:460},{x:1192,y:460}];
 s.expectedCount=total;s.practice={each,groups,mode,progress,moved,remaining:total-moved};

 s.annotation=T(243,75,progress?`一共${total}个 · 剩${total-moved}个`:`一共${total}个`,31)+T(1000,45,'教材第42页 · 想想做做1',28,'muted')+T(1000,99,avg?`平均分成${groups}组`:`每${each}个分成一组`,36,avg?'groups':'each');
 const visibleGroups=avg?groups:progress;
 for(let g=0;g<visibleGroups;g++){
  const c=centers[g],w=groups===1?650:212,h=groups===1?238:190;
  s.decor+=rect(c.x-w/2,c.y-h/2,w,h,'#fff4da',avg?'#c69768':'#8ba99b',18);
  s.annotation+=T(c.x,c.y+h/2+33,`第${g+1}组`,25,'groups');
 }
 const rows=Math.ceil(total/6),startY=348-(rows-1)*28;
 s.objects=Array.from({length:total},(_,i)=>{
  if(i>=moved)return object('cube',i,77+i%6*65,startY+Math.floor(i/6)*56,.86);
  const group=avg?i%groups:Math.floor(i/each),j=avg?Math.floor(i/groups):i%each,c=centers[group];let x,y,scale;
  if(groups===1){x=c.x+(j-3)*88;y=c.y;scale=1.2;}
  else if(each===6){x=c.x+(j%2?29:-29);y=c.y-54+Math.floor(j/2)*54;scale=.90;}
  else{x=c.x+(j%4-1.5)*49;y=c.y-31+Math.floor(j/4)*62;scale=.84;}
  return object('cube',i,x,y,scale);
 });
 const divisor=avg?groups:each,answer=avg?each:groups;
 if(solved){
  s.decor+=paper(34,153,418,380);
  s.annotation+=`<g transform="translate(28 185) scale(.87)">${E(0,135,total,'÷',divisor,answer,['总数',avg?'组数':'每组个数',avg?'每组个数':'组数'],avg?['total','groups','each']:['total','each','groups'])}</g>`;
  s.annotation+=T(243,450,avg?`每组${each}个`:`分成${groups}组`,43,avg?'each':'groups');
 }else{
  s.annotation+=T(243,624,`${total} ÷ ${divisor} ＝ □`,52);
  if(!avg&&progress===0)s.annotation+=T(1000,324,'可以分成几组？',58,'groups');
  if(moved===total)s.annotation+=T(243,277,'正好分完',42)+T(243,383,avg?'每组几个？':'分成几组？',46,avg?'each':'groups');
 }
 s.description=`${total}个正方体。${avg?`平均分${groups}组，已每组分${progress}个`:`每${each}个一组，已分${progress}组`}；剩${total-moved}个。${solved?`${total}÷${divisor}＝${answer}，商表示${avg?'每组个数':'组数'}。`:'先分图，商尚未填写。'}`;
 return s;
}

function askBefore(section,id,scene,revealTitle,questionTitle){
 const i=lessons[section].findIndex(step=>step.id===id);
 if(i<0)throw new Error(`Missing reveal state: ${id}`);
 const old=lessons[section][i];
 const question={...old,title:questionTitle||old.title,label:old.label+' · 先思考',phase:'question',
  note:'本步先停留，听学生回答；下一步才显示参考内容。'+old.note,
  scene:()=>({...scene(),phase:'question',revealTarget:id+'-reveal'})};
 const reveal={...old,id:id+'-reveal',title:revealTitle,label:old.label+' · 再揭示',phase:'reveal',
  scene:()=>({...old.scene(),phase:'reveal',questionId:id})};
 lessons[section].splice(i,1,question,reveal);
}

function renderProblem(step,animate){
 const main=$('#classroom'),card=$('#problemCard'),text=$('#problemText'),p=step.problem;
 if(!p){main.dataset.problem='none';card.hidden=true;card.dataset.key='';return;}
 const mode=p.opening?'top':'docked';
 const move=animate&&card.dataset.key===p.key&&main.dataset.problem==='top'&&mode==='docked'&&state.speed>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
 card.style.transitionDuration=move?`${state.speed}ms`:'0ms';
 text.style.transitionDuration=card.style.transitionDuration;
 // 保留同一个文字节点，同一题的每一步都不改写原题。
 if(card.dataset.key!==p.key)text.textContent=p.text;
 card.dataset.key=p.key;card.hidden=false;main.dataset.problem=mode;
}

const state={section:0,indices:[0,0,0],speed:760,busy:false,timer:null,generation:0};
const topicLabels=['算式 → 口诀','教材第42页','教材第43页'];
function current(){return lessons[state.section][state.indices[state.section]];}
function cancelMotion(){state.generation++;clearTimeout(state.timer);state.busy=false;$$('#objects .token').forEach(e=>{e.style.transition='none';e.style.transitionDelay='0ms';});}
function distributionEnd(){
 const id=current().id,m=id.match(/^(cube-row|flower-group|flower-average|cherry-group|cherry-average|textbook-\d+-(?:take|share))-(\d+)$/);
 if(!m)return -1;
 const steps=lessons[state.section];let end=state.indices[state.section];
 while(end+1<steps.length&&steps[end+1].id.startsWith(m[1]+'-')&&/^\d+$/.test(steps[end+1].id.slice(m[1].length+1)))end++;
 return end>state.indices[state.section]?end:-1;
}
function finishDistribution(){if(state.busy)return;const end=distributionEnd();if(end<0)return;cancelMotion();state.indices[state.section]=end;render(true);}
function renderUnitTask(data,animate){
 const layer=$('#unitMotion'),task=data.unitTask;
 const moving=!!(animate&&task&&task.phase==='answer'&&layer.dataset.key===task.key&&layer.dataset.phase==='question'&&state.speed>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches);
 layer.dataset.key=task?task.key:'';layer.dataset.phase=task?task.phase:'';
 $('#scene').dataset.unitAnimate=String(moving);$('#scene').setAttribute('style',`--unit-duration:${state.speed}ms`);
 if(!data.unitFlight){layer.innerHTML='';return;}
 const f=data.unitFlight;
 layer.innerHTML=`<g class="unit-flight${moving?' is-moving':''}" style="--unit-dx:${f.from.x-f.to.x}px;--unit-dy:${f.from.y-f.to.y}px">${T(f.to.x,f.to.y,f.text,f.fontSize,'groups')}</g>`;
}
function chooseUnit(unit){
 if(state.busy)return;
 const task=current().scene().unitTask;
 if(!task||task.phase!=='question'||!task.options.includes(unit))return;
 if(unit!==task.unit){$('#unitFeedback').textContent=task.hint;return;}
 next();
}
function render(animate=false){
 const step=current(),data=step.scene(),g=$('#objects');
 renderProblem(step,animate);
 $('#question').textContent=step.title;$('#topicNumber').textContent=String(state.section+1).padStart(2,'0');$('#topicLabel').textContent=topicLabels[state.section];
 $('#classroom').setAttribute('aria-labelledby',`tab${state.section}`);
 $$('[data-section]').forEach(b=>b.setAttribute('aria-selected',Number(b.dataset.section)===state.section));
 $('#decor').innerHTML=data.decor;$('#annotation').innerHTML=data.annotation;$('#sceneTitle').textContent=step.title;$('#sceneDesc').textContent=(step.problem?step.problem.text+' ':'')+data.description;$('#live').textContent=step.title;
 renderUnitTask(data,animate);
 const keep=new Set(data.objects.map(o=>o.id));Array.from(g.children).forEach(e=>{if(!keep.has(e.dataset.id))e.remove();});
 const motion=animate&&state.speed>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
 data.objects.forEach((o,i)=>{let el=g.querySelector(`[data-id="${o.id}"]`),created=!el;
  if(!el){el=document.createElementNS(NS,'g');el.dataset.id=o.id;el.setAttribute('class','token');const use=document.createElementNS(NS,'use');use.setAttribute('href',`#${o.kind}Shape`);el.append(use);g.append(el);}
  el.style.transition=motion&&!created?`transform ${state.speed}ms cubic-bezier(.22,.75,.25,1)`:'none';el.style.transitionDelay='0ms';el.style.transform=`translate(${o.x}px, ${o.y}px) scale(${o.s})`;el.dataset.x=o.x;el.dataset.y=o.y;
 });
 const ix=state.indices[state.section],len=lessons[state.section].length;
 $('#stepCount').textContent=`${ix+1} / ${len}`;$('#stateName').textContent=step.label;$('#progress').style.width=`${(ix+1)/len*100}%`;
 $('#prev').disabled=state.section===0&&ix===0;$('#next').disabled=state.section===2&&ix===len-1;
 $('#next').textContent=data.unitTask?.phase==='question'?'口答后标注 →':ix===len-1?(state.section===2?'本课完成 ✓':'下一环节 →'):'下一步 →';
 $('#finishDistribution').hidden=distributionEnd()<0;$('#finishDistribution').disabled=false;
 $('#jump').innerHTML=lessons[state.section].map((s,i)=>`<option value="${i}" ${i===ix?'selected':''}>${i+1}. ${esc(s.label)} — ${esc(s.title)}</option>`).join('');
 $('#noteTitle').textContent=step.label;$('#note').textContent=step.note;$('#evidence').textContent='学生屏只呈现当前问题、图形变化和必要算式。此提示窗口关闭后才恢复投影教学。';
 if(motion&&data.objects.length){const gen=state.generation;state.busy=true;$('#next').disabled=true;$('#finishDistribution').disabled=true;state.timer=setTimeout(()=>{if(gen!==state.generation)return;state.busy=false;$('#next').disabled=state.section===2&&state.indices[2]===lessons[2].length-1;$('#finishDistribution').disabled=false;},state.speed+(data.unitFlight?180:60));}
}
function next(){if(state.busy)return;const sec=state.section,ix=state.indices[sec];cancelMotion();if(ix<lessons[sec].length-1)state.indices[sec]++;else if(sec<2){state.section++;state.indices[state.section]=0;}render(true);}
function prev(){cancelMotion();if(state.indices[state.section]>0)state.indices[state.section]--;else if(state.section>0){state.section--;state.indices[state.section]=lessons[state.section].length-1;}render(false);}
function selectSection(sec){cancelMotion();state.section=sec;render(false);}
$('#next').addEventListener('click',next);$('#prev').addEventListener('click',prev);
$('#finishDistribution').addEventListener('click',finishDistribution);
$('#scene').addEventListener('click',e=>{const choice=e.target.closest?.('[data-unit-choice]');if(choice)chooseUnit(choice.dataset.unitChoice);});

$$('[data-section]').forEach(b=>b.addEventListener('click',()=>selectSection(Number(b.dataset.section))));
$('#reset').addEventListener('click',()=>{cancelMotion();state.indices[state.section]=0;render(false);});
$('#resetAll').addEventListener('click',()=>{cancelMotion();state.indices=[0,0,0];state.section=0;$('#teacher').close();render(false);});
$('#jump').addEventListener('change',e=>{cancelMotion();state.indices[state.section]=Number(e.target.value);render(false);});
$('#speed').addEventListener('change',e=>{cancelMotion();state.speed=Number(e.target.value);render(false);});
$('#teacherBtn').addEventListener('click',()=>{cancelMotion();render(false);$('#teacher').showModal();});
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).close()));

function answerBlock(q,a){return `<div class="exercise-intro">${q}</div><button class="reveal" data-reveal>揭示参考答案</button><div class="answer" hidden>${a}</div>`;}
function renderExercises(){
 $('#exerciseTabs').innerHTML=exerciseLabels.map((s,i)=>`<button class="${i===exerciseTab?'active':''}" data-exercise-tab="${i}">${s}</button>`).join('');
 let h='';
 if(exerciseTab===0)h='<p class="exercise-intro">第42页第1题：算一算，再说每组用了哪一句口诀。</p>'+inputs([['6×7＝',42],['42÷6＝',7],['42÷7＝',6],['7×1＝',7],['7÷7＝',1],['7÷1＝',7],['7×5＝',35],['35÷7＝',5],['35÷5＝',7]])+answerBlock('第42页第2题：选一句7的口诀，说出对应的除法算式。','二七十四：14÷2＝7，14÷7＝2。<br>一七得七：7÷1＝7，7÷7＝1。<br>七七四十九：49÷7＝7，两道对应算式相同，只需说一道。');
 if(exerciseTab===1){let cells='';for(let r=0;r<3;r++)for(let c=0;c<7;c++)cells+=rect(440+c*78,18+r*44,78,44,'#f7df83','#b6a374',0);h='<p class="exercise-intro">第43页第3题：看图填一填。</p>'+`<svg class="exercise-svg" viewBox="0 0 1500 170" role="img" aria-label="3行7列的方格图">${cells}</svg>`+inputs([['7×3＝',21],['3×7＝',21],['□÷7＝3，□＝',21],['□÷3＝7，□＝',21]])+'<p class="exercise-intro">第43页第4题：先看运算符号，再计算。</p>'+inputs([['28÷7＝',4],['7÷1＝',7],['21÷7＝',3],['14÷2＝',7],['42−7＝',35],['14÷7＝',2],['35÷5＝',7],['49÷7＝',7],['35＋7＝',42]]);}
 if(exerciseTab===2){h=answerBlock('第43页第6题：离艺术节开幕还有35天，再过几个星期？','1个星期有7天。35÷7＝5（个）。答：再过5个星期。');h+=answerBlock('第43页第7题：把28个小正方体摆成教材右图的物体，可以摆多少个？先到“教材原图”看清一个物体用了几个小正方体。','教材右图一层7块（后排4块，前排3块）。每个物体用7个小正方体。<br>28÷7＝4（个）。答：可以摆4个。');h+=answerBlock('第43页第8题：一幢楼房有7层，______。一共住了多少户？先补充条件，再解答。','示例：每层住4户。4×7＝28（户）。答：一共住了28户。<br>每层住2户、3户、5户等都可以；关键是每层同样多，所补条件能求出总户数。');}
 if(exerciseTab===3)h=`<p class="exercise-intro">教材第42页：讲一个用28÷7或28÷4计算的故事。先说总数，再说怎么分，最后提出问题。</p><div class="story"><label>我的故事<textarea placeholder="一共有……，……，求……？"></textarea></label></div>`+answerBlock('说一说，你的商表示什么？','28÷7示例：有28本书，每7本一包，可以装几包？28÷7＝4（包）。<br>28÷4示例：有28本书，平均放在4个书架上，每个书架几本？28÷4＝7（本）。');
 $('#exerciseBody').innerHTML=h;
 $$('[data-exercise-tab]').forEach(b=>b.addEventListener('click',()=>{exerciseTab=Number(b.dataset.exerciseTab);renderExercises();}));
 const checks=$('#exerciseBody');
 checks.querySelectorAll('[data-reveal]').forEach(b=>b.addEventListener('click',()=>{const a=b.nextElementSibling;a.hidden=!a.hidden;b.textContent=a.hidden?'揭示参考答案':'收起参考答案';}));
 checks.querySelectorAll('[data-answer]').forEach(inp=>inp.addEventListener('input',()=>{inp.nextElementSibling.textContent='';}));
 checks.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>{b.closest('.exercise-set').querySelectorAll('[data-answer]').forEach(i=>{const f=i.nextElementSibling,filled=i.value.trim()!=='';f.textContent=!filled?'还没填':Number(i.value)===Number(i.dataset.answer)?'✓ 正确':'再想一想';f.className='feedback '+(filled&&Number(i.value)===Number(i.dataset.answer)?'correct':'incorrect');});}));
 checks.querySelectorAll('[data-show]').forEach(b=>b.addEventListener('click',()=>{b.closest('.exercise-set').querySelectorAll('[data-answer]').forEach(i=>{i.value=i.dataset.answer;i.nextElementSibling.textContent='参考答案';i.nextElementSibling.className='feedback correct';});}));
}
$('#exerciseBtn').addEventListener('click',()=>{renderExercises();$('#exercise').showModal();});
window.lessonAPI={lessons,state,current,render,next,prev,selectSection,cancelMotion,scene:()=>current().scene()};
render(false);
</script>
</body></html>
