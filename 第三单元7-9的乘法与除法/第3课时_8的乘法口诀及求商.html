<style>
:root{--ink:#30443d;--muted:#827561;--green:#315d49;--each:#277d9c;--groups:#ba652f;--total:#30443d;--paper:#fffaf0;--gold:#e9b951}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;background:#f5eddd;color:var(--ink)}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #277d9c;outline-offset:4px}button:disabled{opacity:.4;cursor:default}
.app{height:100dvh;display:grid;grid-template-rows:74px minmax(0,1fr) 66px;padding:0 26px;position:relative;isolation:isolate;background:radial-gradient(ellipse at 12% 0%,#fffdf6,transparent 60%),linear-gradient(100deg,#f7efdf,#faf5e9)}.app:before{content:"";position:absolute;bottom:8%;left:0;right:0;height:22%;background:repeating-linear-gradient(0deg,transparent,transparent 37px,#9a7f4b08 38px,transparent 39px);z-index:-1;transform:skewY(-2deg);pointer-events:none}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #bea77e40}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.seal{width:45px;height:45px;display:grid;place-items:center;background:var(--green);color:#fff6df;font:700 33px Georgia,serif;border-radius:13px;box-shadow:0 4px 0 #1d3d2e}.brand b{font-size:19px;letter-spacing:1px}.brand small{display:block;margin-top:4px;font-size:12px;letter-spacing:2px;color:var(--muted)}nav{display:flex;gap:6px}nav button{border:0;border-bottom:3px solid transparent;background:transparent;padding:18px 22px 15px;font-size:18px;font-weight:700}nav button[aria-selected=true]{border-bottom-color:var(--green);color:var(--green)}nav span{font:italic 19px Georgia,serif;margin-right:9px;color:#a28965}.tools{display:flex;gap:8px}.quiet{border:1px solid #c4af8955;border-radius:9px;background:#fffaf09c;padding:9px 13px;font-size:14px}.quiet:hover{background:#fffdf7}
main{min-height:0;display:grid;grid-template-rows:74px minmax(0,1fr)}.question{display:flex;align-items:center;gap:19px;padding:8px 22px 0}.kicker{border-right:1px solid #bba37c55;padding-right:18px;display:grid;gap:4px;white-space:nowrap;font-size:13px;color:var(--muted)}.kicker b{font:italic 22px Georgia,serif;color:#9c7546}h1{margin:0;font-size:clamp(25px,2.35vw,41px);line-height:1.35;letter-spacing:.025em}.scene-wrap{position:relative;min-height:0;display:grid;place-items:center}#scene{width:100%;height:100%;display:block}#scene text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:var(--ink);font-weight:700}#scene .each{fill:var(--each)}#scene .groups{fill:var(--groups)}#scene .muted{fill:var(--muted)}#scene .soft{fill:#a59071}#scene .token{filter:url(#object-shadow)}.footer{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #bea77e40}.progress{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);min-width:240px}.track{width:100px;height:4px;background:#dfd0b5;border-radius:5px;overflow:hidden}.track i{display:block;height:100%;background:var(--green);transition:width .2s}.controls{display:flex;gap:12px}.step{border:1px solid #c5ae8755;border-radius:12px;padding:11px 25px;background:var(--paper);font-weight:700;box-shadow:0 3px 0 #cdb79155;font-size:17px}.next{background:var(--green);color:#fff7e5;border-color:var(--green);min-width:140px;box-shadow:0 3px 0 #244634}.utility{display:flex;gap:7px}.step-label{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
dialog{padding:0;border:1px solid #d6c3a2;border-radius:19px;max-height:90dvh;background:var(--paper);color:var(--ink);width:min(980px,94vw);box-shadow:0 20px 90px #1c3c2b66}dialog::backdrop{background:#213e3299}.modal-head{padding:16px 24px;border-bottom:1px solid #d8c6a8;display:flex;justify-content:space-between;align-items:center;gap:20px}.modal-head h2{margin:0;font-size:22px}.modal-body{padding:24px;overflow:auto;max-height:calc(90dvh - 73px)}#book{width:min(850px,94vw)}#book .modal-body{background:white}#book img{display:block;width:100%;height:auto}.teacher-layout{display:grid;grid-template-columns:1fr 1.1fr;gap:30px}.teacher-layout label{display:block;margin-bottom:20px;font-size:16px}.teacher-layout select{display:block;width:100%;margin-top:9px;border:1px solid #c9b28b;border-radius:8px;padding:10px;background:#fffef8}.teacher-layout p{font-size:17px;line-height:1.75}.note{border-left:4px solid #bf8750;padding-left:20px}.note h3{font-size:21px;margin-top:0}.switches{display:flex;gap:9px;flex-wrap:wrap}
@media(max-height:810px){.app{grid-template-rows:64px minmax(0,1fr) 60px;padding:0 20px}main{grid-template-rows:65px minmax(0,1fr)}nav button{padding:15px 17px 12px;font-size:17px}.seal{width:39px;height:39px;font-size:29px}.brand b{font-size:17px}.step{padding:9px 21px;font-size:16px}.question{padding-left:12px}.brand small{font-size:11px}}
@media(max-width:1120px){.brand small,.track,.step-label{display:none}.brand b{font-size:15px}nav button{padding:15px 12px 12px;font-size:15px}.tools .quiet,.utility .quiet{font-size:12px;padding:8px}.progress{min-width:80px}.app{padding:0 12px}h1{font-size:25px}.question{gap:12px}.kicker{padding-right:12px}}
@media(max-width:720px){.app{grid-template-rows:104px minmax(0,1fr) 90px;padding:0 8px}header{flex-wrap:wrap;gap:0}.brand{width:68%;margin-top:8px}.tools{margin-top:8px}nav{order:3;width:100%;justify-content:center}nav button{padding:11px 10px;font-size:14px}.kicker{display:none}main{grid-template-rows:60px minmax(0,1fr)}h1{font-size:20px}.question{padding:8px}.footer{flex-wrap:wrap;justify-content:center;padding:5px;gap:6px}.controls{order:0}.utility{order:1}.progress{order:2}.step{padding:9px 17px;font-size:14px}.next{min-width:120px}.teacher-layout{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.track i{transition:none}}

/* Keep an equal reserved row from the opening state, so moving the problem does not resize the model. */
main{--head-height:74px;--problem-height:66px;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--head-height) minmax(0,1fr)}
main.has-problem{grid-template-rows:var(--head-height) minmax(0,1fr) var(--problem-height)}
.question{grid-column:1;grid-row:1}.scene-wrap{grid-column:1;grid-row:2}
.problem-card{grid-column:1;grid-row:1;align-self:center;justify-self:center;width:calc(100% - 40px);min-height:58px;display:flex;align-items:center;gap:18px;padding:9px 20px;border:1px solid #b4c7ae;border-left:5px solid #527d60;border-radius:14px;background:#fffdf4;box-shadow:0 4px 10px #8e795513;z-index:2;pointer-events:none}
.problem-card[hidden],#finishDistribution[hidden],#support[hidden]{display:none}.problem-card[data-position="bottom"]{grid-row:3}
.problem-label{flex:none;font-size:15px;color:#527d60;font-weight:700}.problem-card p{margin:0;font-size:clamp(20px,2.05vw,30px);line-height:1.4;font-weight:700;overflow-wrap:anywhere}
main.problem-opening .question{visibility:hidden}
@media(max-height:810px){main{--head-height:65px}}
@media(max-width:1120px){.problem-card{width:calc(100% - 18px);gap:10px;padding:8px 12px}.problem-card p{font-size:21px}}
@media(max-width:720px){main{--head-height:66px;--problem-height:84px}.problem-card{min-height:60px}.problem-card p{font-size:18px}.problem-label{font-size:12px}.controls{gap:7px}#finishDistribution{padding:7px;font-size:12px}}
#scene [data-unit-choice]{cursor:pointer}#scene .unit-choice:hover rect{fill:#f3e2b6}#scene .unit-choice:focus-visible{outline:none}#scene .unit-choice:focus-visible rect{stroke:#315d49;stroke-width:4}#unitMotion{pointer-events:none}

// Each complete model is made from eight actual octants, rather than faces counted as cubes.
const octants=[];for(let z=0;z<2;z++)for(let depth=0;depth<=2;depth++)for(let x=0;x<2;x++)for(let y=0;y<2;y++)if(x+y===depth)octants.push({x,y,z,key:`${x}${y}${z}`});
function solid(group,cx,cy,scale=1,mode='closed'){
 return octants.map((p,i)=>{
  let x=cx+(p.x-p.y)*32*scale,y=cy+((p.x+p.y)*16-p.z*37)*scale;
  if(mode==='layers')y=p.z===1?cy-155+(p.x+p.y)*32:cy+105+(p.x+p.y)*32;
  if(mode==='fan'){const j=p.x*2+p.y;x=210+j*190;y=p.z===1?250:510;scale=1.6;}
  return obj(`g${group}-${p.key}`,'cube',x,y,scale);
 });
}
function quantityTable(filled,active){
 const x=55,y=24,w=912,h=102,label=184,cw=(w-label)/8;
 let s=R(x,y,w,h,'#fffaf0','#95bcca',10);
 for(let r=0;r<2;r++){s+=R(x,y+r*h/2,label,h/2,'#dfedf0','',0);s+=T(x+label/2,y+34+r*51,r?'小正方体个数':'大正方体个数',24);}
 s+=L(x,y+51,x+w,y+51,'#99bdc8');s+=L(x+label,y,x+label,y+h,'#99bdc8');
 for(let n=1;n<=8;n++){
  const xx=x+label+(n-1)*cw;if(n===active)s+=R(xx+2,y+2,cw-4,h-4,'#f4d58455','',2);
  if(n>1)s+=L(xx,y,xx,y+h,'#99bdc8',1.5);
  s+=T(xx+cw/2,y+34,n,28,n===active?'groups':'');
  s+=T(xx+cw/2,y+87,n<=filled?n*8:(n===active?'?':''),32,n===active?'groups':'');
 }
 return s;
}
function cubeScene(n=1,{mode='closed',filled=0,active=0,board='',caption='',showTable=true}={}){
 const s=base();s.decor=paper();s.annotation=heading('摆积木 · 编口诀')+board;
 if(showTable)s.annotation+=quantityTable(filled,active);
 if(n===1){s.objects=solid(0,500,420,mode==='closed'?3.5:2.1,mode);if(mode==='layers'){s.annotation+=T(500,193,'上层',27,'muted')+T(500,690,'下层',27,'muted');}if(mode==='fan'){s.decor+=L(115,318,885,318)+L(115,578,885,578);s.annotation+=T(100,258,'上层',25,'muted')+T(100,518,'下层',25,'muted');}}
 else{
  const cols=n<=3?n:4,rows=n>4?2:1,scale=n===2?2.05:n===3?1.68:1.35;
  for(let g=0;g<n;g++){const r=Math.floor(g/cols),c=g%cols,cx=510+(c-(cols-1)/2)*(n===2?380:n===3?280:220),cy=rows===1?435:290+r*266;s.objects.push(...solid(g,cx,cy,scale));}
 }
 if(showTable&&mode==='closed')for(let g=0;g<n;g++){
  const blocks=s.objects.filter(o=>o.id.startsWith(`g${g}-`));

 }

 return s;
}

let problemAnimation=null;
function renderProblem(step,animate){
 const card=$('#problem'),main=$('#classroom'),p=step.problem,oldID=card.dataset.problemId,oldPosition=card.dataset.position;
 const before=card.getBoundingClientRect();
 card.hidden=!p;main.classList.toggle('has-problem',!!p);main.classList.toggle('problem-opening',!!p?.opening);
 if(!p)return;
 card.dataset.problemId=p.id;card.dataset.position=p.opening?'top':'bottom';$('#problemText').textContent=p.text;$('#problemLabel').textContent=p.label||'原题';
 const after=card.getBoundingClientRect();
 if(animate&&state.speed>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&oldID===p.id&&oldPosition==='top'&&!p.opening&&card.animate){
  problemAnimation=card.animate([{transform:`translate(${before.left-after.left}px,${before.top-after.top}px)`},{transform:'translate(0,0)'}],{duration:Math.min(550,state.speed),easing:'cubic-bezier(.22,.7,.25,1)'});
 }
}
function distributionTarget(){
 const id=current().id;
 if(id==='stars-group-1')return lessons[1].findIndex(s=>s.id==='stars-group-finish');
 if(/^stars-average-[12]$/.test(id))return lessons[1].findIndex(s=>s.id==='stars-average-finish');
 return -1;
}
function toggleSupport(){
 if(state.busy||!currentStep().support)return;
 cancelMotion();state.support=!state.support;void render(true);
}
function finishDistribution(){const target=distributionTarget();if(target<0||state.busy)return;cancelMotion();state.support=false;state.indices[state.section]=target;void render(true);}

// One persistent object node per actual cube/star. Animation is derived from the final state.
const state={section:0,indices:[0,0,0],speed:700,busy:false,generation:0,raf:null,display:null,pending:null,support:false};
const topicLabels=['教材例3 · 编口诀','教材试一试 · 乘除法','巩固与总结'];
function currentStep(){return lessons[state.section][state.indices[state.section]];}
function current(){const step=currentStep();return state.support&&step.support?{...step,...step.support,id:step.id}:step;}
function objectNodes(){return Array.from($('#objects').children);}
function cancelMotion(){if(problemAnimation){problemAnimation.cancel();problemAnimation=null;}state.generation++;if(state.raf!==null)cancelAnimationFrame(state.raf);state.raf=null;if(state.pending){state.pending(false);state.pending=null;}state.busy=false;$('#unitMotion').innerHTML='';}
function buttonStates(){$('#support').hidden=!currentStep().support;$('#support').disabled=state.busy;$('#support').textContent=state.support?'返回当前题':currentStep().support?.label||'提示';$('#finishDistribution').hidden=distributionTarget()<0;$('#finishDistribution').disabled=state.busy;const i=state.indices[state.section],last=i===lessons[state.section].length-1;$('#prev').disabled=state.section===0&&i===0;$('#next').disabled=state.busy||(state.section===2&&last);$('#next').textContent=state.busy?'正在演示…':current().scene().unitTask?.phase==='question'?'口答后标注 →':last?state.section===2?'本课完成 ✓':'下一环节 →':'下一步 →';}
function applyData(data,positions=null){
 $('#unitMotion').innerHTML='';
 $('#decor').innerHTML=data.decor;$('#annotation').innerHTML=data.annotation;$('#sceneDesc').textContent=data.description;
 const group=$('#objects'),keep=new Set(data.objects.map(o=>o.id)),old=new Map(objectNodes().map(e=>[e.dataset.id,e]));
 old.forEach((e,id)=>{if(!keep.has(id))e.remove();});
 data.objects.forEach(o=>{
  let e=old.get(o.id);if(!e){e=document.createElementNS(NS,'g');e.dataset.id=o.id;e.setAttribute('class','token');const use=document.createElementNS(NS,'use');use.setAttribute('href',`#${o.kind}Shape`);e.append(use);}
  const p=positions?.get(o.id)||o;e.setAttribute('transform',`translate(${p.x} ${p.y}) scale(${p.s})`);e.dataset.x=String(p.x);e.dataset.y=String(p.y);e.dataset.s=String(p.s);e.dataset.kind=o.kind;group.append(e);
 });
 state.display=data;
}
function metadata(deferUnit=false){
 const step=current(),i=state.indices[state.section],len=lessons[state.section].length;
 const title=deferUnit?'圈出所数的对象，把单位标进括号。':step.title;
 $('#question').textContent=title;$('#sceneTitle').textContent=title;$('#live').textContent=step.problem.text+' '+title;$('#topicNumber').textContent=String(state.section+1).padStart(2,'0');$('#topicLabel').textContent=topicLabels[state.section];$('#classroom').setAttribute('aria-labelledby',`tab${state.section}`);
 $$('[data-section]').forEach(b=>b.setAttribute('aria-selected',Number(b.dataset.section)===state.section));
 $('#stepCount').textContent=`${i+1} / ${len}`;$('#stateName').textContent=step.label;$('#progress').style.width=`${(i+1)/len*100}%`;
 $('#jump').innerHTML=lessons[state.section].map((s,j)=>`<option value="${j}"${j===i?' selected':''}>${j+1}. ${esc(s.label)} — ${esc(s.title)}</option>`).join('');
 $('#noteTitle').textContent=step.label;$('#note').textContent=step.note;$('#checkpoint').textContent=step.check?`观察学生：${step.check}`:'';buttonStates();
}
function morph(data,duration,generation){
 if(duration===0){applyData(data);return Promise.resolve(true);}
 const from=new Map(objectNodes().map(e=>[e.dataset.id,{x:Number(e.dataset.x),y:Number(e.dataset.y),s:Number(e.dataset.s)}]));
 data.objects.forEach(o=>{if(!from.has(o.id))from.set(o.id,{x:o.x+70,y:o.y,s:o.s*.82});});
 // Show final annotations only after mathematical movement has completed.
 applyData({...data,annotation:''},from);
 return new Promise(resolve=>{state.pending=resolve;let start=null;function frame(time){
  if(generation!==state.generation){resolve(false);return;}
  if(start===null)start=time;const t=Math.min(1,(time-start)/duration),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const nodes=new Map(objectNodes().map(n=>[n.dataset.id,n]));
  data.objects.forEach(o=>{const a=from.get(o.id),p={x:a.x+(o.x-a.x)*e,y:a.y+(o.y-a.y)*e,s:a.s+(o.s-a.s)*e},n=nodes.get(o.id);n.setAttribute('transform',`translate(${p.x} ${p.y}) scale(${p.s})`);n.dataset.x=String(p.x);n.dataset.y=String(p.y);n.dataset.s=String(p.s);});
  if(t<1)state.raf=requestAnimationFrame(frame);else{state.raf=null;state.pending=null;applyData(data);resolve(true);}
 }state.raf=requestAnimationFrame(frame);});
}
async function render(animate=false){
 const step=current(),data=step.scene(),generation=state.generation;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 renderProblem(step,animate);metadata(animate&&state.speed>0&&!reduced&&!!data.unitFlight);
 if(!animate||state.speed===0||reduced||!data.objects.length){applyData(data);buttonStates();return;}
 if(data.unitFlight){state.busy=true;buttonStates();const done=await flyUnit(data,state.speed,generation);if(!done||generation!==state.generation)return;state.busy=false;metadata();return;}
 const frames=step.sequence?step.sequence():[data];state.busy=true;buttonStates();
 for(const f of frames){if(generation!==state.generation)return;const done=await morph(f,step.sequence?Math.max(180,state.speed*.67):state.speed,generation);if(!done||generation!==state.generation)return;}
 applyData(data);state.busy=false;buttonStates();
}
function flyUnit(data,duration,generation){
 applyData({...data,annotation:data.unitInitialAnnotation});
 const f=data.unitFlight,layer=$('#unitMotion');
 return new Promise(resolve=>{state.pending=resolve;let start=null;function frame(time){
  if(generation!==state.generation){resolve(false);return;}
  if(start===null)start=time;
  const t=Math.min(1,(time-start)/duration),p=1-Math.pow(1-t,3);
  layer.innerHTML=T(f.from.x+(f.to.x-f.from.x)*p,f.from.y+(f.to.y-f.from.y)*p,f.unit,40-8*p,f.cls);
  if(t<1)state.raf=requestAnimationFrame(frame);else{state.raf=null;state.pending=null;applyData(data);resolve(true);}
 }state.raf=requestAnimationFrame(frame);});
}
function chooseUnit(unit){
 if(state.busy||$$('dialog[open]').length)return;
 const task=current().scene().unitTask;
 if(!task||task.phase!=='question'||!task.options.includes(unit))return;
 if(unit!==task.unit){$('#unitFeedback').textContent=task.hint;return;}
 next();
}
function next(){if(state.busy)return;const s=state.section,i=state.indices[s];if(s===2&&i===lessons[2].length-1)return;cancelMotion();state.support=false;if(i<lessons[s].length-1)state.indices[s]++;else{state.section++;state.indices[state.section]=0;}void render(true);}
function prev(){cancelMotion();state.support=false;if(state.indices[state.section]>0)state.indices[state.section]--;else if(state.section>0){state.section--;state.indices[state.section]=lessons[state.section].length-1;}void render(false);}
function selectSection(s){if(!Number.isInteger(s)||s<0||s>2)return;cancelMotion();state.support=false;state.section=s;void render(false);}
function goTo(s,i){if(!lessons[s]||!lessons[s][i])throw Error('无效教学状态');cancelMotion();state.support=false;state.section=s;state.indices[s]=i;return render(false);}
$('#support').addEventListener('click',toggleSupport);
$('#scene').addEventListener('click',e=>{const card=e.target.closest?.('[data-unit-choice]');if(card)chooseUnit(card.dataset.unitChoice);});
$('#scene').addEventListener('keydown',e=>{const card=e.target.closest?.('[data-unit-choice]');if(card&&(e.key==='Enter'||e.code==='Space')){e.preventDefault();e.stopPropagation();chooseUnit(card.dataset.unitChoice);}});
$('#finishDistribution').addEventListener('click',finishDistribution);
window.addEventListener('resize',()=>{if(problemAnimation){problemAnimation.cancel();problemAnimation=null;}});
$('#next').addEventListener('click',next);$('#prev').addEventListener('click',prev);
$$('[data-section]').forEach(b=>b.addEventListener('click',()=>selectSection(Number(b.dataset.section))));
$('#reset').addEventListener('click',()=>{cancelMotion();state.support=false;state.indices[state.section]=0;void render(false);});
$('#resetAll').addEventListener('click',()=>{cancelMotion();state.support=false;state.section=0;state.indices=[0,0,0];$('#teacher').close();void render(false);});
$('#jump').addEventListener('change',e=>{void goTo(state.section,Number(e.target.value));});
$('#speed').addEventListener('change',e=>{cancelMotion();state.speed=Number(e.target.value);void render(false);});
$('#skipMotion').addEventListener('click',()=>{cancelMotion();void render(false);});
$('#teacherBtn').addEventListener('click',()=>{cancelMotion();void render(false);$('#teacher').showModal();});
$('#bookBtn').addEventListener('click',()=>{cancelMotion();void render(false);$('#book').showModal();});
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).close()));
document.addEventListener('keydown',e=>{if($$('dialog[open]').length||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.target.closest?.('[data-unit-choice]')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.code==='Space'&&e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'||e.code==='Space'){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}});
$('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('#fullscreen').textContent='请用F11全屏';}});
window.lessonAPI={lessons,state,current,render,next,prev,selectSection,goTo,cancelMotion,finishDistribution,toggleSupport,currentStep,chooseUnit,scene:()=>current().scene(),defs};
void render(false);

</script>
</body>
</html>
