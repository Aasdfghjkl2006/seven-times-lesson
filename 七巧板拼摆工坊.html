header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px;gap:12px;flex:0 0 auto;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px}
.logo-badge{
  width:44px;height:44px;border-radius:16px;
  background:linear-gradient(180deg,#ffe9a8,#ffc94d);
  display:grid;place-items:center;font-size:22px;
  box-shadow:inset 0 2px 0 #fff,0 4px 0 #e0a45e,0 8px 14px rgba(180,118,50,.22);
}
.brand h1{font-size:clamp(18px,1.8vw,26px);font-weight:900;letter-spacing:.04em;color:#6b3f1d}
.brand small{display:block;font-size:12px;color:#a67c52;font-weight:600}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  border:none;cursor:pointer;user-select:none;
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:800;
  color:#7a4a12;background:linear-gradient(180deg,#ffedc9,#ffd79e);
  border:2px solid rgba(255,255,255,.95);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(216,152,72,.35),0 4px 0 #e0a45e,0 8px 14px rgba(180,118,50,.18);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 3px 0 rgba(216,152,72,.35),0 2px 0 #e0a45e}
.btn.active{
  background:linear-gradient(180deg,#b8f0d2,#7fd9ab);color:#1d6a45;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(90,170,120,.4),0 4px 0 #5fae82,0 8px 14px rgba(80,150,105,.2);
}
.hint-chip{
  font-size:13px;color:#8a6a4a;font-weight:600;padding:6px 14px;border-radius:999px;
  background:rgba(255,248,236,.8);border:2px solid #f3e2c2;
}
main{
  flex:1 1 auto;min-height:0;display:flex;gap:14px;padding:4px 20px 12px;
}
.canvas-wrap{
  flex:1 1 auto;min-width:0;position:relative;
  background:rgba(255,248,236,.62);border-radius:28px;
  border:3px solid rgba(226,180,120,.55);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 16px 32px rgba(130,88,52,.14);
  backdrop-filter:blur(3px);
  overflow:hidden;
}
#canvas{position:absolute;inset:0}
.guide-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.guide-poly{fill:none;stroke:#c9a87a;stroke-width:.7;stroke-dasharray:2 1.4;opacity:.55}
.piece{
  position:absolute;cursor:grab;touch-action:none;user-select:none;
  filter:drop-shadow(2px 3px 3px rgba(120,80,40,.25));
  transition:filter .12s ease;
}
.piece:hover{filter:drop-shadow(3px 5px 5px rgba(120,80,40,.35)) brightness(1.04)}
.piece.dragging{cursor:grabbing;z-index:1000!important;filter:drop-shadow(6px 9px 8px rgba(120,80,40,.4)) brightness(1.06)}
.piece svg{display:block;width:100%;height:100%;overflow:visible}
.piece .piece-tag{
  position:absolute;top:-9px;left:-9px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(180deg,#fff,#ffe3b0);color:#7a4a12;
  font-size:12px;font-weight:900;display:grid;place-items:center;
  border:2px solid #fff;box-shadow:0 2px 0 rgba(190,130,60,.3);
  pointer-events:none;z-index:2;
}
.piece .rot-ind{
  position:absolute;bottom:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
  background:#ffc94d;border:2px solid #fff;box-shadow:0 2px 0 rgba(190,130,60,.3);
  display:none;place-items:center;font-size:11px;color:#7a4a12;font-weight:900;
  pointer-events:none;z-index:2;
}
.piece.selected{outline:3px dashed #ffb45e;outline-offset:4px;border-radius:6px}
.piece.selected .rot-ind{display:grid}
.side{
  flex:0 0 250px;display:flex;flex-direction:column;gap:10px;
  max-height:100%;overflow:auto;
}
.panel{
  background:rgba(255,248,236,.8);border-radius:22px;
  border:2.5px solid #f3e2c2;padding:14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 10px 20px rgba(130,88,52,.1);
}
.panel h3{
  font-size:14px;color:#8a5a22;font-weight:900;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.panel h3 .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#ffc94d,#ff9a3d);display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .lg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#8a6a4a;font-weight:700}
.legend .sw{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(120,80,40,.2)}
.rot-btns{display:flex;gap:8px}
.rot-btns .btn{flex:1;padding:8px 6px;font-size:13px}
.pos-info{
  font-size:12px;color:#a67c52;line-height:1.7;
  background:rgba(255,244,224,.8);border-radius:14px;padding:10px;
  border:2px dashed #ecd9ae;
}
textarea.export{
  width:100%;height:150px;border:2px dashed #ecd9ae;border-radius:14px;
  background:rgba(255,250,240,.9);color:#6b4a2c;font-size:11px;
  font-family:ui-monospace,monospace;padding:10px;resize:none;outline:none;
}
footer{flex:0 0 auto;padding:8px 24px 12px;display:flex;justify-content:center}
.tip{
  font-size:13px;color:#a67c52;font-weight:600;padding:6px 18px;border-radius:999px;
  background:rgba(255,248,236,.8);border:2px solid #f3e2c2;
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-badge">🧩</div>
    <h1>七巧板拼摆工坊<small>鼠标拖一拖 · 滚轮转一转</small></h1>
  </div>
  <div class="toolbar">
    <button class="btn active" id="btnGuide">🐱 参考轮廓</button>
    <button class="btn" id="btnSnap">🎯 摆成标准猫</button>
    <button class="btn" id="btnReset">↺ 一键复位</button>
    <button class="btn" id="btnExport">📋 导出位置</button>
  </div>
</header>
<main>
  <div class="canvas-wrap">
    <div id="canvas"></div>
    <svg class="guide-svg" id="guideSvg" viewBox="0 0 86 86" preserveAspectRatio="none"></svg>
  </div>
  <aside class="side">
    <div class="panel">
      <h3><span class="dot"></span>7块零件</h3>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <h3><span class="dot"></span>旋转</h3>
      <div class="rot-btns">
        <button class="btn" id="rotL">↺ 左转</button>
        <button class="btn" id="rotR">↻ 右转</button>
      </div>
      <p class="pos-info" id="posInfo">选中一块零件后：<br>· 鼠标拖拽移动<br>· 滚轮旋转 15°<br>· 点击左右转按钮</p>
    </div>
    <div class="panel">
      <h3><span class="dot"></span>导出位置</h3>
      <textarea class="export" id="exportBox" placeholder="点击「导出位置」生成坐标 JSON，发给豆包可固化进课件"></textarea>
    </div>
  </aside>
</main>
<footer>
  <div class="tip">提示：拖拽任意七巧板零件到画布 · 单击选中后可滚轮/按钮旋转 · 参考轮廓显示标准猫的位置</div>
</footer>

<script>
const PIECES = [{"id": "largeOrange", "fill": "#f59939", "points": "26,25 26,71 49,49", "label": "1", "name": "大三角", "minX": 26, "minY": 25, "w": 23, "h": 46, "sx": 50, "sy": 47, "vx": 50, "vy": 47, "rot": 0}, {"id": "largeRed", "fill": "#ec4650", "points": "49,50 17,82 48,83", "label": "2", "name": "大三角", "minX": 17, "minY": 50, "w": 32, "h": 33, "sx": 60, "sy": 47, "vx": 60, "vy": 47, "rot": 0}, {"id": "mediumYellow", "fill": "#f1ef8b", "points": "25,24 9,41 25,58", "label": "3", "name": "中三角", "minX": 9, "minY": 24, "w": 16, "h": 34, "sx": 70, "sy": 47, "vx": 70, "vy": 47, "rot": 0}, {"id": "smallPink", "fill": "#ed84aa", "points": "1,1 1,22 11,12", "label": "4", "name": "小三角", "minX": 1, "minY": 1, "w": 10, "h": 21, "sx": 47, "sy": 64, "vx": 47, "vy": 64, "rot": 0}, {"id": "smallCyan", "fill": "#17afc2", "points": "24,1 14,11 24,22", "label": "5", "name": "小三角", "minX": 14, "minY": 1, "w": 10, "h": 21, "sx": 57, "sy": 64, "vx": 57, "vy": 64, "rot": 0}, {"id": "squareGreen", "fill": "#94ca5c", "points": "13,12 1,23 12,35 24,23", "label": "6", "name": "正方形", "minX": 1, "minY": 12, "w": 23, "h": 23, "sx": 67, "sy": 64, "vx": 67, "vy": 64, "rot": 0}, {"id": "parallelogramPurple", "fill": "#9a549f", "points": "52,82 74,82 84,72 62,72", "label": "7", "name": "平行四边形", "minX": 52, "minY": 72, "w": 32, "h": 10, "sx": 77, "sy": 64, "vx": 77, "vy": 64, "rot": 0}];
const GUIDE_POLYS = ["26,25 26,71 49,49", "49,50 17,82 48,83", "25,24 9,41 25,58", "1,1 1,22 11,12", "24,1 14,11 24,22", "13,12 1,23 12,35 24,23", "52,82 74,82 84,72 62,72"];
const VIEW = 86;
let scale = 8, ox = 0, oy = 0;
let selected = null;
let showGuide = true;
let dragState = null;

function fitCanvas(){
  const cw = document.getElementById('canvas');
  const rect = cw.parentElement.getBoundingClientRect();
  cw.style.width = rect.width+'px';
  cw.style.height = rect.height+'px';
  const inner = Math.min(rect.width, rect.height);
  scale = inner / VIEW * 0.96;
  ox = (rect.width - VIEW*scale)/2;
  oy = (rect.height - VIEW*scale)/2;
  document.querySelectorAll('.piece').forEach(el=>{
    const p = PIECES_BY_ID[el.dataset.id];
    applyPos(el, p);
  });
}

function applyPos(el, p){
  el.style.left = (ox + p.vx*scale - el.offsetWidth/2) + 'px';
  el.style.top  = (oy + p.vy*scale - el.offsetHeight/2) + 'px';
}

function buildPieces(){
  const canvas = document.getElementById('canvas');
  PIECES.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'piece';
    el.dataset.id = p.id;
    el.innerHTML = '<span class="piece-tag">'+p.label+'</span><span class="rot-ind">⟳</span>'+
      '<svg viewBox="'+p.minX+' '+p.minY+' '+p.w+' '+p.h+'" preserveAspectRatio="xMidYMid meet">'+
      '<polygon points="'+p.points+'" fill="'+p.fill+'"/></svg>';
    canvas.appendChild(el);
    p.rot = 0; p.el = el;
    el.style.width = (p.w*scale*1.06)+'px';
    el.style.height = (p.h*scale*1.06)+'px';
    applyPos(el, p);
    bindDrag(el, p);
    el.addEventListener('click', e=>{ e.stopPropagation(); selectPiece(p); });
  });
  document.getElementById('canvas').addEventListener('click', ()=>{ selectPiece(null); });
}

function selectPiece(p){
  document.querySelectorAll('.piece').forEach(e=>e.classList.remove('selected'));
  selected = p;
  if(p){
    p.el.classList.add('selected');
    document.getElementById('posInfo').innerHTML = '已选中：'+p.name+'（'+p.label+'）<br>拖拽移动 · 滚轮旋转<br>当前角度：'+p.rot+'°';
  } else {
    document.getElementById('posInfo').innerHTML = '选中一块零件后：<br>· 鼠标拖拽移动<br>· 滚轮旋转 15°<br>· 点击左右转按钮';
  }
}

function bindDrag(el, p){
  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    dragState = {p:p, el:el, startX:e.clientX, startY:e.clientY, vx0:p.vx, vy0:p.vy};
    el.classList.add('dragging');
    el.style.zIndex = 1000;
    selectPiece(p);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragState || dragState.p !== p) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    p.vx = dragState.vx0 + dx/scale;
    p.vy = dragState.vy0 + dy/scale;
    applyPos(el, p);
  });
  el.addEventListener('pointerup', e=>{
    if(dragState && dragState.p===p){
      dragState = null;
      el.classList.remove('dragging');
      el.style.zIndex = '';
    }
  });
  el.addEventListener('pointercancel', ()=>{
    dragState = null; el.classList.remove('dragging'); el.style.zIndex='';
  });
  el.addEventListener('wheel', e=>{
    e.preventDefault();
    rotatePiece(p, e.deltaY<0 ? 15 : -15);
  }, {passive:false});
}

function rotatePiece(p, deg){
  p.rot = (p.rot + deg) % 360;
  p.el.style.transform = 'rotate('+p.rot+'deg)';
  if(selected===p){
    document.getElementById('posInfo').innerHTML = '已选中：'+p.name+'（'+p.label+'）<br>拖拽移动 · 滚轮旋转<br>当前角度：'+p.rot+'°';
  }
}

function buildGuide(){
  const svg = document.getElementById('guideSvg');
  svg.innerHTML = GUIDE_POLYS.map(pts=>'<polygon class="guide-poly" points="'+pts+'"/>').join('');
}

function toggleGuide(){
  showGuide = !showGuide;
  document.getElementById('guideSvg').style.display = showGuide ? '' : 'none';
  document.getElementById('btnGuide').classList.toggle('active', showGuide);
}

function snapToCat(){
  PIECES.forEach(p=>{
    p.vx = p.minX + p.w/2;
    p.vy = p.minY + p.h/2;
    p.rot = 0;
    applyPos(p.el, p);
    p.el.style.transform = 'rotate(0deg)';
  });
  selectPiece(null);
}

function resetPos(){
  PIECES.forEach(p=>{
    p.vx = p.sx; p.vy = p.sy; p.rot = 0;
    applyPos(p.el, p);
    p.el.style.transform = 'rotate(0deg)';
  });
  selectPiece(null);
}

function exportPos(){
  const out = PIECES.map(p=>({id:p.id, x:+(p.vx).toFixed(2), y:+(p.vy).toFixed(2), rot:+(p.rot).toFixed(1)}));
  const json = JSON.stringify({pieces:out}, null, 1);
  document.getElementById('exportBox').value = json;
  if(navigator.clipboard){ navigator.clipboard.writeText(json).catch(()=>{}); }
}

document.getElementById('btnGuide').addEventListener('click', toggleGuide);
document.getElementById('btnSnap').addEventListener('click', snapToCat);
document.getElementById('btnReset').addEventListener('click', resetPos);
document.getElementById('btnExport').addEventListener('click', exportPos);
document.getElementById('rotL').addEventListener('click', ()=>{ if(selected) rotatePiece(selected,-15); });
document.getElementById('rotR').addEventListener('click', ()=>{ if(selected) rotatePiece(selected,15); });

const legend = document.getElementById('legend');
PIECES.forEach(p=>{
  const d = document.createElement('div');
  d.className = 'lg-item';
  d.innerHTML = '<span class="sw" style="background:'+p.fill+'"></span>'+p.label+'·'+p.name;
  legend.appendChild(d);
});

let PIECES_BY_ID = Object.fromEntries(PIECES.map(p=>[p.id,p]));
buildGuide();
buildPieces();
window.addEventListener('resize', fitCanvas);
fitCanvas();
</script>
</body>
</html>
