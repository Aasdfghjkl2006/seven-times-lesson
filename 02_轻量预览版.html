<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>7的乘法口诀｜暖色绘本 · 材料架修复版</title>
  <style>
:root{
  --ink:#18324d;
  --ink-soft:#8a6a4a;
  --blue:#6abbea;
  --blue-deep:#2f78b7;
  --blue-pale:#ecd9ae;
  --paper:#fffdf8;
  --cream:#fff4d8;
  --gold:#f5b83f;
  --orange:#ef8a31;
  --green:#88c85f;
  --pink:#e978a4;
  --red:#ef4b53;
  --cyan:#24afc2;
  --purple:#9155a4;
  --shadow:0 16px 40px rgba(43,74,99,.13);
  --border:rgba(76,126,164,.17);
  --groups-color:#ef8a31;
  --each-color:#268dc7;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--ink);background:#edf7fc}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid rgba(47,120,183,.24);outline-offset:2px}
.app-shell{width:100%;height:100dvh;min-height:640px;display:grid;grid-template-rows:72px minmax(0,1fr) 72px;gap:12px;padding:12px 20px 14px;background:
  radial-gradient(circle at 8% -8%,rgba(255,255,255,.96) 0 20%,transparent 38%),
  radial-gradient(circle at 94% 6%,rgba(255,236,191,.72) 0 16%,transparent 34%),
  linear-gradient(135deg,#fff6e6 0%,#f9fcff 48%,#fff8ea 100%);
}
.lesson-header{display:flex;align-items:center;justify-content:center}
.lesson-steps{width:min(1120px,92vw);display:grid;grid-template-columns:1fr 1.38fr 1fr;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid #ecd9ae;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(41,91,126,.1)}
.lesson-step{min-height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:900;color:#6b4a2c;cursor:pointer;position:relative}
.lesson-step:not(:last-child)::after{content:"";position:absolute;right:0;top:12px;bottom:12px;width:1px;background:#ecd9ae}
.lesson-step .step-no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#f5c26b;color:white;font-weight:1000}
.lesson-step.is-active{background:linear-gradient(180deg,#fff7dd,#ffe7ad);color:#875410}
.lesson-step.is-active .step-no{background:linear-gradient(#ffc85b,#f59f2e);box-shadow:0 0 0 5px rgba(245,184,63,.18)}
.lesson-step.is-locked{opacity:.5;cursor:default}
.lesson-screen{display:none;min-height:0}.lesson-screen.is-active{display:block}
.card-surface{background:rgba(255,255,255,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.panel-kicker,.board-kicker{font-size:17px;font-weight:900;letter-spacing:.03em;color:#6b4a2c}

/* review */
.review-layout{height:100%;display:grid;grid-template-columns:56% 44%;gap:18px;min-height:0}
.review-visual{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:22px 24px;background:
  linear-gradient(180deg,rgba(228,246,255,.9),rgba(255,255,255,.95) 32%),
  var(--paper)}
.review-groups{min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,1.4vw,24px);padding:22px 6px;flex-wrap:nowrap}
.group-tray{min-width:0;width:min(150px,18%);aspect-ratio:1/1.03;border-radius:28px 28px 38px 38px;background:linear-gradient(180deg,#fff8ec 0%,#f5e4c4 100%);border:3px solid #f0dcb8;box-shadow:inset 0 -12px 0 rgba(92,160,195,.08),0 12px 18px rgba(45,101,132,.1);display:grid;place-items:center;padding:14px;position:relative}
.group-tray::after{content:"";position:absolute;left:16%;right:16%;bottom:8%;height:8px;border-radius:50%;background:rgba(52,101,131,.08);filter:blur(4px)}
.block-set{display:grid;grid-template-columns:repeat(2,minmax(22px,42px));gap:9px;place-content:center}
.math-block{width:clamp(28px,3.1vw,48px);aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#ffd978,#f3ad3c);border:2px solid rgba(167,102,17,.16);box-shadow:inset 4px 4px 0 rgba(255,255,255,.32),0 7px 11px rgba(132,87,27,.14)}
.example-progress{display:flex;justify-content:center;gap:9px;padding-top:6px}
.example-dot{width:12px;height:12px;border-radius:50%;background:#fff6e6;border:0;padding:0;transition:.2s}.example-dot.is-current{width:32px;border-radius:10px;background:#f4b33d}
.review-math{padding:26px 28px;display:grid;grid-template-rows:auto minmax(130px,1fr) auto auto;gap:14px;align-items:center;background:linear-gradient(180deg,#fffdfa,#ffffff)}
.review-stage-title{text-align:center;font-size:22px;font-weight:900;color:#6b4a2c}
.review-expression{display:grid;place-items:center;text-align:center;min-height:0;font-size:clamp(48px,5.6vw,90px);font-weight:1000;line-height:1.08;letter-spacing:.02em}
.review-expression .num-groups{color:var(--groups-color)}
.review-expression .num-each{color:var(--each-color)}
.cross-zone{display:none;align-self:stretch;grid-template-rows:auto 30px auto;justify-items:center;align-items:center;padding:10px 12px 2px}.cross-zone.is-visible{display:grid}
.phrase-line{font-size:clamp(42px,4.3vw,70px);font-weight:1000}.phrase-line .num-groups{color:var(--groups-color)}.phrase-line .num-each{color:var(--each-color)}
.cross-arrows{height:30px;width:180px;position:relative;color:#ecd9ae;font-size:30px;font-weight:800}.cross-arrow{position:absolute;top:-4px}.cross-left{left:38px}.cross-right{right:38px}
.equation-slots{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(42px,4.4vw,72px);font-weight:1000}
.slot{min-width:1.1em;text-align:center;border-radius:14px;padding:.02em .14em}.slot-each{color:var(--each-color);background:rgba(38,141,199,.09)}.slot-groups{color:var(--groups-color);background:rgba(239,138,49,.1)}.slot-total{color:#2d4c69}
.times,.equals{color:#34536f}
.micro-state{justify-self:center;display:flex;gap:8px;align-items:center}
.micro-dot{width:42px;height:8px;border-radius:6px;background:#fff6e6}.micro-dot.is-current{background:#f3b441}.micro-dot.is-done{background:#8fc7e5}

/* tangram */
.tangram-layout{height:100%;display:grid;grid-template-rows:25% minmax(0,75%);gap:14px;min-height:0}
.textbook-table{padding:14px 18px 16px;background:linear-gradient(180deg,#fff7e8,#ffffff)}
.table-title-row{height:30px;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.ghost-btn{border:1px solid #fff6e6;background:#fdf7ea;border-radius:13px;padding:7px 12px;font-weight:800;color:#6b4a2c;cursor:pointer}
.book-grid{height:calc(100% - 39px);display:grid;grid-template-columns:1.7fr repeat(7,1fr);grid-template-rows:1fr 1fr;border:2px solid #5bbbe9;border-radius:15px;overflow:hidden;background:#fff6e6}
.book-grid>*{min-width:0;display:flex;align-items:center;justify-content:center;border-right:1px solid #66bce3;border-bottom:1px solid #66bce3;font-weight:900}
.book-grid>*:nth-child(8),.book-grid>*:last-child{border-right:0}
.book-grid>*:nth-child(n+9){border-bottom:0}
.grid-label{gap:7px;background:linear-gradient(90deg,#fff6e6,#fff6e6);font-size:clamp(14px,1.25vw,19px)}
.cat-label img{width:38px;height:38px;object-fit:contain;flex:0 0 auto}.result-label{grid-column:1;grid-row:2}

.result-cell[data-result-cell="1"]{grid-column:2;grid-row:2}.result-cell[data-result-cell="2"]{grid-column:3;grid-row:2}.result-cell[data-result-cell="3"]{grid-column:4;grid-row:2}.result-cell[data-result-cell="4"]{grid-column:5;grid-row:2}.result-cell[data-result-cell="5"]{grid-column:6;grid-row:2}.result-cell[data-result-cell="6"]{grid-column:7;grid-row:2}.result-cell[data-result-cell="7"]{grid-column:8;grid-row:2}

.grid-cell{font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;font-size:clamp(20px,1.8vw,30px);background:rgba(255,255,255,.28);transition:.25s}
.count-cell.is-current{background:#fff3c8;box-shadow:inset 0 0 0 4px #f1b53c;color:#8b5a08}
.result-cell.is-filled{background:#fff8db;color:#a65e00}.result-cell.is-new{animation:cellPop .42s ease both}
@keyframes cellPop{0%{transform:scale(.7);opacity:.1}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.tangram-main{display:grid;grid-template-columns:52% 48%;gap:16px;min-height:0}
.cat-workbench{display:grid;grid-template-rows:auto minmax(0,1fr);padding:18px 20px;background:
  radial-gradient(circle at 18% 6%,rgba(255,255,255,.9),transparent 24%),
  linear-gradient(180deg,#f5dfb8 0 20%,#f5c26b 20% 52%,#d9a766 52% 100%)}
.workbench-head{display:flex;justify-content:space-between;align-items:center}.piece-audit{font-size:14px;font-weight:900;color:#6b4a2c;background:rgba(255,255,255,.72);padding:6px 10px;border-radius:14px}
.cat-stage{min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(20px,2.6vw,44px);padding:12px 8px 5px;transition:.4s}
.cat-slot{position:relative;width:min(45%,330px);aspect-ratio:1.02;border-radius:30px;background:linear-gradient(180deg,rgba(250,253,255,.95),rgba(225,238,247,.96));border:3px solid rgba(255,255,255,.88);box-shadow:inset 0 0 0 2px rgba(130,173,198,.24),0 16px 25px rgba(45,87,110,.13);display:grid;place-items:center;transition:.35s;overflow:visible}
.cat-slot.is-hidden{display:none}.slot-caption{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#fff2c7;border:2px solid #e5be66;border-radius:18px;padding:5px 14px;font-size:15px;font-weight:1000;white-space:nowrap;z-index:5}
.cat-svg-wrap{width:78%;height:78%;display:grid;place-items:center}.cat-svg-wrap svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 7px rgba(36,74,92,.16))}
.tg-piece{stroke:rgba(38,72,91,.14);stroke-width:.6;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;transition:transform 900ms cubic-bezier(.2,.76,.2,1),filter 250ms,opacity 220ms}.tg-piece.is-glowing{filter:drop-shadow(0 0 8px rgba(255,190,49,.9))}
.math-board{padding:24px 28px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;align-items:center;background:
  linear-gradient(180deg,#fffdfa,#fff 50%),
  var(--paper)}
.board-kicker{text-align:center;align-self:start}.board-main{display:block;align-self:center;text-align:center;font-size:clamp(48px,5.1vw,84px);font-weight:1000;line-height:1.12;letter-spacing:.01em;min-height:0;padding:8px}.board-main .accent-seven{color:#6b4a2c}.board-main .accent-count{color:#ed8a31}.board-main .accent-result{color:#e45151}.board-main .blank{display:inline-block;min-width:2.1em;border-bottom:8px solid #f1b53c;transform:translateY(-.08em)}
.board-support{min-height:30px;text-align:center;font-size:23px;font-weight:900;color:#6b4a2c}
.chant-growth{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:48px}.chant-chip{background:linear-gradient(#fff4fa,#ffe0ec);border:2px solid #f3b7cf;color:#7f415b;border-radius:18px;padding:9px 15px;font-size:18px;font-weight:1000;animation:chantIn .36s ease both}@keyframes chantIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}

/* dock */
.teacher-dock{display:flex;align-items:center;justify-content:center;gap:10px}.dock-btn{height:50px;border:1px solid #f0dcc0;background:rgba(255,255,255,.94);border-radius:18px;padding:0 18px;font-weight:1000;color:#6b4a2c;box-shadow:0 8px 20px rgba(46,82,108,.09);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:17px}.dock-btn:hover{transform:translateY(-1px)}.dock-primary{background:linear-gradient(#ffd36e,#ffb746);border-color:#eca832;color:#6e4604}.dock-icon{width:50px;padding:0;justify-content:center;font-size:22px}.state-counter{min-width:220px;text-align:center;font-size:17px;font-weight:900;color:#6b4a2c;background:rgba(255,255,255,.58);padding:10px 16px;border-radius:15px}

/* dialog */
.textbook-dialog{width:min(760px,88vw);height:min(90vh,920px);border:0;border-radius:24px;padding:14px;background:#fff;box-shadow:0 28px 80px rgba(22,47,69,.28)}.textbook-dialog::backdrop{background:rgba(23,48,67,.52);backdrop-filter:blur(5px)}.dialog-toolbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}.textbook-image-wrap{height:calc(100% - 42px);display:grid;place-items:center;overflow:auto;background:#f3f6f7;border-radius:16px}.textbook-image-wrap img{max-width:100%;height:auto;display:block}

@media (max-width:1100px){
  .app-shell{padding-left:12px;padding-right:12px;grid-template-rows:66px minmax(0,1fr) 64px}
  .lesson-step{font-size:15px}.review-layout{grid-template-columns:52% 48%;gap:12px}.tangram-main{grid-template-columns:50% 50%;gap:10px}.book-grid{grid-template-columns:1.55fr repeat(7,1fr)}
  .review-visual,.review-math,.math-board{padding:16px}.cat-workbench{padding:14px}.dock-btn{height:46px}.state-counter{min-width:180px}
}
@media (max-height:760px){
  .app-shell{min-height:0;grid-template-rows:56px minmax(0,1fr) 56px;gap:8px;padding-top:8px;padding-bottom:8px}
  .lesson-step{min-height:42px}.lesson-step .step-no{width:28px;height:28px}.review-visual,.review-math{padding-top:14px;padding-bottom:14px}.group-tray{aspect-ratio:1/1}.math-block{width:clamp(25px,2.8vw,40px)}
  .tangram-layout{grid-template-rows:27% minmax(0,73%);gap:8px}.textbook-table{padding:9px 14px}.table-title-row{height:24px;margin-bottom:6px}.cat-workbench,.math-board{padding-top:12px;padding-bottom:12px}.dock-btn{height:44px}.teacher-dock{gap:8px}
}


/* ===== v1.2 视觉层级与转化动画增强 ===== */
.app-shell{position:relative;isolation:isolate;background:
  radial-gradient(circle at 7% 9%,rgba(255,255,255,.98) 0 7%,transparent 18%),
  radial-gradient(circle at 94% 4%,rgba(255,225,156,.52) 0 9%,transparent 24%),
  linear-gradient(135deg,#fff6e6 0%,#fdf7ea 42%,#fff3dc 100%)}
.app-shell::before,.app-shell::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.app-shell::before{width:190px;height:190px;right:3%;top:12%;border-radius:42% 58% 55% 45%;background:rgba(113,201,232,.12);transform:rotate(18deg)}
.app-shell::after{width:240px;height:110px;left:-40px;bottom:7%;border-radius:50%;background:rgba(246,183,62,.10);transform:rotate(-8deg)}
.lesson-header{position:relative}
.lesson-header::before{content:"7 的乘法口诀";position:absolute;left:1.2vw;top:50%;transform:translateY(-50%);font-size:clamp(18px,1.65vw,27px);font-weight:1000;color:#6b4a2c;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#fff7e8);border:2px solid #fff6e6;border-radius:18px;padding:8px 15px;box-shadow:0 8px 20px rgba(50,100,135,.10)}
.card-surface{position:relative;border:2px solid rgba(112,172,207,.18);box-shadow:0 18px 46px rgba(43,74,99,.14),inset 0 1px 0 rgba(255,255,255,.75)}
.review-visual::before,.math-board::before,.cat-workbench::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(83,145,180,.13);border-radius:20px;pointer-events:none}
.review-visual{overflow:hidden;background:
  radial-gradient(circle at 88% 12%,rgba(255,218,114,.30) 0 7%,transparent 19%),
  linear-gradient(180deg,rgba(220,245,255,.97),rgba(255,255,255,.98) 34%),var(--paper)}
.review-visual::after{content:"分组操作区";position:absolute;right:24px;top:20px;font-weight:900;font-size:14px;color:#ecd9ae;background:rgba(255,255,255,.72);padding:6px 12px;border-radius:999px}
.group-tray{background:linear-gradient(160deg,#ffffff 0%,#fff6e6 72%,#fff6e6 100%);border-color:#ecd9ae;box-shadow:inset 0 -14px 0 rgba(69,142,181,.06),0 14px 22px rgba(44,91,118,.12)}
.math-block{border-radius:14px;background:linear-gradient(145deg,#ffe49a,#f5b63d);box-shadow:inset 4px 4px 0 rgba(255,255,255,.44),inset -3px -3px 0 rgba(185,111,22,.08),0 8px 12px rgba(132,87,27,.16)}
.review-math{background:
  linear-gradient(rgba(88,159,199,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(88,159,199,.045) 1px,transparent 1px),
  linear-gradient(180deg,#fffdfa,#fff);background-size:28px 28px,28px 28px,auto}
.review-stage-title{justify-self:center;background:#fff6e6;border:2px solid #fff6e6;border-radius:999px;padding:7px 18px;color:#6b4a2c}

/* 明显的交叉转化舞台 */
.cross-zone{position:relative;grid-template-rows:auto 94px auto;padding:18px 16px 8px;width:100%;max-width:680px;justify-self:center;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(249,253,255,.92));border:2px solid #fff6e6;border-radius:28px;box-shadow:0 14px 32px rgba(45,91,119,.10);overflow:visible}
.cross-zone.is-visible{display:grid}
.phrase-line{background:#fff8e7;border:2px solid #f0d493;border-radius:20px;padding:11px 24px;box-shadow:0 8px 18px rgba(142,105,27,.08)}
.cross-arrows{height:94px;width:300px;position:relative;color:transparent;font-size:0}
.cross-arrows::before,.cross-arrows::after{content:"";position:absolute;top:18px;width:118px;height:54px;border-bottom:6px solid;border-radius:0 0 70% 70%;opacity:.9}
.cross-arrows::before{left:30px;border-color:var(--groups-color);transform:rotate(20deg);animation:drawCrossA .75s ease both}
.cross-arrows::after{right:30px;border-color:var(--each-color);transform:rotate(-20deg);animation:drawCrossB .75s .08s ease both}
.cross-left,.cross-right{display:none}
.cross-arrows span{display:none}
.cross-arrows{--arrowSize:12px}
@keyframes drawCrossA{from{clip-path:inset(0 100% 0 0);opacity:.15}to{clip-path:inset(0 0 0 0);opacity:.95}}
@keyframes drawCrossB{from{clip-path:inset(0 0 0 100%);opacity:.15}to{clip-path:inset(0 0 0 0);opacity:.95}}
.equation-slots{background:#fff8ec;border:2px solid #fff6e6;border-radius:22px;padding:12px 22px;min-width:min(580px,94%);box-shadow:0 8px 18px rgba(49,100,132,.07)}
.slot{transition:opacity .2s,transform .25s}.slot.is-awaiting{opacity:.05;transform:scale(.72)}
.cross-ghost{filter:drop-shadow(0 10px 12px rgba(51,84,103,.16))}
.cross-caption{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);font-size:16px;font-weight:1000;color:#6b4a2c;background:#fff;border:2px solid #fff6e6;border-radius:999px;padding:5px 12px;z-index:3}

/* 教材表格像一张被放大的教材卡片 */
.textbook-table{background:linear-gradient(180deg,#f2fbff 0%,#fffdf8 100%);border-color:#ecd9ae}
.textbook-table::after{content:"教材同步填写";position:absolute;right:86px;top:13px;color:#6b4a2c;font-size:14px;font-weight:900;background:#fff6e6;border-radius:999px;padding:5px 10px}
.book-grid{box-shadow:0 8px 18px rgba(61,124,157,.08);background:#fff6e6}
.count-cell.is-current{animation:currentPulse 1.4s ease-in-out infinite alternate}
@keyframes currentPulse{from{box-shadow:inset 0 0 0 3px #f1b53c}to{box-shadow:inset 0 0 0 5px #f1b53c,0 0 0 5px rgba(241,181,60,.12)}}

/* 操作台更有层次 */
.cat-workbench{overflow:hidden;background:
  radial-gradient(circle at 85% 12%,rgba(255,246,198,.84) 0 7%,transparent 20%),
  linear-gradient(180deg,#fff6e6 0 20%,#8ed5ec 20% 53%,#d8a56b 53% 100%)}
.cat-workbench::after{content:"";position:absolute;left:0;right:0;top:52%;height:5px;background:rgba(112,72,30,.08);box-shadow:0 10px 25px rgba(107,69,31,.12);pointer-events:none}
.workbench-head{z-index:2}.piece-audit{box-shadow:0 6px 14px rgba(50,91,111,.08)}
.cat-slot{background:linear-gradient(160deg,#fff 0%,#edf7fc 55%,#fff6e6 100%);box-shadow:inset 0 0 0 2px rgba(130,173,198,.20),0 18px 30px rgba(45,87,110,.16)}
.cat-slot::before{content:"";position:absolute;left:16%;right:16%;bottom:13%;height:14px;border-radius:50%;background:rgba(44,79,97,.08);filter:blur(6px)}

/* 数学板书：真正的主视觉 */
.math-board{overflow:hidden;background:
  linear-gradient(rgba(90,155,190,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(90,155,190,.05) 1px,transparent 1px),
  linear-gradient(180deg,#fffef9,#fff);background-size:32px 32px,32px 32px,auto}
.math-board::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;right:20px;top:18px;background:#ef7fa5;box-shadow:0 0 0 6px rgba(239,127,165,.12)}
.board-kicker{justify-self:center;background:#eef8fd;border:2px solid #fff6e6;border-radius:999px;padding:7px 16px;color:#6b4a2c}
.board-main{width:100%;display:grid;place-items:center}
.board-support{font-size:20px;color:#6b4a2c}
.chant-growth{align-self:end}

/* 三层数学转化动画：连加 → 几个7 → 乘法 */
.transform-stack{width:min(700px,96%);display:grid;gap:13px;justify-items:center;align-items:center}
.transform-row{width:100%;display:flex;justify-content:center;align-items:center;gap:.16em;border-radius:22px;padding:10px 14px;font-size:clamp(34px,3.8vw,62px);font-weight:1000;line-height:1;opacity:0;transform:translateY(16px) scale(.97)}
.transform-row.source{background:#fff7dd;border:2px solid #f1d58c}
.transform-row.phrase{background:#f2f9ff;border:2px solid #ecd9ae;font-size:clamp(31px,3.3vw,52px)}
.transform-row.target{background:#fff;border:3px solid #ecd9ae;box-shadow:0 10px 24px rgba(57,110,143,.10)}
.transform-row.show{animation:stackIn .46s ease forwards}.transform-row.delay1{animation-delay:.35s}.transform-row.delay2{animation-delay:.72s}
@keyframes stackIn{to{opacity:1;transform:none}}
.transform-down{height:20px;width:4px;border-radius:4px;background:linear-gradient(#9fc8dd,#6eaccd);opacity:0;animation:lineGrow .3s .25s ease forwards}
@keyframes lineGrow{to{height:30px;opacity:1}}
.transform-note{font-size:15px;font-weight:900;color:#6b4a2c;background:#fff;border:1px solid #ecd9ae;border-radius:999px;padding:4px 10px}

/* 交叉写大演示 */
.cross-board{position:relative;width:min(680px,96%);min-height:330px;display:grid;grid-template-rows:auto 130px auto;justify-items:center;align-items:center;background:linear-gradient(180deg,#fffaf0,#fdf7ea);border:3px solid #ecd9ae;border-radius:30px;padding:18px 22px;box-shadow:0 18px 34px rgba(46,92,118,.11);overflow:hidden}
.cross-board .source-phrase{font-size:clamp(40px,4.2vw,68px);font-weight:1000;background:#fff;border:2px solid #ecdca9;border-radius:20px;padding:9px 24px;z-index:3}
.cross-board .target-eq{font-size:clamp(42px,4.6vw,74px);font-weight:1000;background:#fff7e8;border:2px solid #ecd9ae;border-radius:22px;padding:10px 24px;z-index:3}
.cross-track{position:relative;width:360px;height:130px}
.cross-track .track-a,.cross-track .track-b{position:absolute;top:20px;width:150px;height:70px;border-bottom:7px solid;border-radius:0 0 70% 70%;opacity:.92}
.cross-track .track-a{left:25px;border-color:var(--groups-color);transform:rotate(19deg);animation:drawCrossA .75s .08s ease both}
.cross-track .track-b{right:25px;border-color:var(--each-color);transform:rotate(-19deg);animation:drawCrossB .75s .16s ease both}
.cross-track .cross-word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:white;border:2px solid #fff6e6;border-radius:999px;padding:5px 12px;font-size:15px;font-weight:1000;color:#6b4a2c}
.cross-board .target-eq .incoming{display:inline-block;opacity:.08;transform:scale(.78)}
.cross-board.run .target-eq .incoming{animation:incoming .36s .75s ease forwards}
.cross-board.run .target-eq .incoming:nth-child(3){animation-delay:.83s}
@keyframes incoming{to{opacity:1;transform:none}}

/* 导航与底座更像课堂控件，不抢画面 */
.teacher-dock{position:relative}
.teacher-dock::before{content:"教师控制";font-size:13px;color:#8a6a4a;font-weight:900;margin-right:2px}
.dock-btn{transition:.18s ease}.dock-btn:active{transform:translateY(1px) scale(.98)}
.state-counter{border:1px solid rgba(147,184,207,.30)}

@media (max-width:1260px){.lesson-header::before{display:none}.cross-board{min-height:280px}.cross-track{height:110px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}}


/* v1.2.1：七巧板环节中的交叉写轨迹 */
.mini-cross{position:relative;width:300px;height:74px;margin:-2px auto 0;opacity:0;animation:miniCrossIn .28s .58s ease forwards}
.mini-cross::before,.mini-cross::after{content:"";position:absolute;top:5px;width:118px;height:48px;border-bottom:6px solid;border-radius:0 0 70% 70%}
.mini-cross::before{left:28px;border-color:var(--groups-color);transform:rotate(20deg);animation:drawCrossA .65s .62s ease both}
.mini-cross::after{right:28px;border-color:var(--each-color);transform:rotate(-20deg);animation:drawCrossB .65s .72s ease both}
.mini-cross-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);font-size:14px;font-weight:1000;color:#6b4a2c;background:#fff;border:2px solid #ecd9ae;border-radius:999px;padding:4px 10px;white-space:nowrap}
@keyframes miniCrossIn{to{opacity:1}}

/* v1.4：所有复习例题统一走完整链路：看图→标每组数量→逐项组成加法→求和→几个几→交叉写乘法 */
.review-groups{padding-bottom:58px}
.group-tray{overflow:visible}
.group-value-tag{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);min-width:54px;height:36px;padding:0 14px;border-radius:18px;display:grid;place-items:center;background:#fff;border:2px solid #e8c992;color:var(--each-color);font-size:24px;font-weight:1000;box-shadow:0 8px 16px rgba(47,120,183,.10);opacity:0;transition:opacity .25s,transform .25s}
.group-value-tag.is-visible{opacity:1;transform:translateX(-50%) translateY(0)}
.group-value-tag.is-source{box-shadow:0 0 0 6px rgba(38,141,199,.10),0 8px 16px rgba(47,120,183,.10)}
.addition-builder{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.2vw,20px);flex-wrap:nowrap;font-size:clamp(44px,5vw,82px);font-weight:1000;min-height:150px;padding:22px 16px;border-radius:28px;background:linear-gradient(180deg,#fffaf0,#fff);border:2px solid #f1dfb7;box-shadow:0 12px 26px rgba(130,94,32,.08)}

.add-term.is-hidden,.add-plus.is-hidden,.add-equals.is-hidden,.add-total.is-hidden{opacity:.06}
.add-term.is-target{opacity:.06;transform:scale(.78)}
.add-term.is-revealed{opacity:1;transform:none}
.add-total{color:#e45b39}
.phrase-bridge{display:grid;gap:18px;place-items:center}
.phrase-bridge .addition-small{font-size:clamp(30px,3vw,48px);font-weight:900;color:#6b4a2c;background:#fff8e9;border:2px solid #f1d89c;border-radius:20px;padding:10px 20px}
.phrase-bridge .phrase-big{font-size:clamp(56px,6vw,94px);font-weight:1000}
.cross-zone.v13-cross{grid-template-rows:auto auto;gap:34px;padding:28px 18px;max-width:720px}
.cross-zone.v13-cross .cross-arrows{display:none!important}
.cross-zone.v13-cross .phrase-line{font-size:clamp(56px,5.4vw,88px);padding:12px 34px}
.cross-zone.v13-cross .equation-slots{font-size:clamp(54px,5.4vw,88px);padding:20px 28px;min-width:min(640px,94%)}
.slot-empty{color:#ecd9ae!important;background:#f5f9fb!important;border:3px dashed #ecd9ae}
.moved-source{opacity:.22;filter:grayscale(.3)}
.motion-ghost{filter:drop-shadow(0 12px 14px rgba(51,84,103,.18))}
.review-stage-title{font-size:clamp(18px,1.65vw,28px)}

/* 七巧板环节的逐步式转化 */
.step-cross-card{width:min(690px,96%);display:grid;gap:28px;justify-items:center;padding:24px 24px 28px;border:3px solid #ecd9ae;border-radius:30px;background:linear-gradient(180deg,#fffaf0,#fdf7ea);box-shadow:0 18px 34px rgba(46,92,118,.11)}
.step-cross-source{font-size:clamp(46px,4.7vw,76px);font-weight:1000;background:#fff;border:2px solid #ecdca9;border-radius:20px;padding:10px 28px}
.step-cross-equation{display:flex;align-items:center;justify-content:center;gap:.18em;font-size:clamp(48px,5vw,82px);font-weight:1000;background:#fff7e8;border:2px solid #ecd9ae;border-radius:22px;padding:16px 28px;min-width:min(610px,94%)}
.step-cross-equation .slot{min-width:1.05em}
.cat-addition-builder{width:min(650px,96%);display:flex;justify-content:center;align-items:center;gap:clamp(10px,1.2vw,20px);font-size:clamp(52px,5vw,82px);font-weight:1000;background:#fff8e6;border:2px solid #efd392;border-radius:26px;padding:22px 24px}
.cat-addition-builder .term{color:var(--each-color);min-width:.8em;text-align:center}.cat-addition-builder .total{color:#e45b39}
.cat-addition-builder .hidden{opacity:.06}
.cat-addition-builder .target{opacity:.06;transform:scale(.8)}
.cat-addition-builder .show{opacity:1;transform:none}
.cat-slot .slot-caption.is-value{font-size:20px;color:#6b4a2c;background:#fff7e8;border-color:#ecd9ae;min-width:76px}

@media(max-width:1200px){.group-value-tag{bottom:-34px;font-size:20px;height:32px}.addition-builder{font-size:clamp(36px,4.6vw,66px)}.cross-zone.v13-cross .phrase-line,.cross-zone.v13-cross .equation-slots{font-size:clamp(42px,5vw,68px)}}



/* ===== v1.5 七只猫完整扩展：有序材料 + 逐步缩放重排 ===== */
.cat-stage{display:grid;align-content:center;justify-content:center;gap:clamp(10px,1.2vw,18px);padding:12px 10px 6px;overflow:visible}
.cat-stage.cat-count-1{grid-template-columns:minmax(260px,390px)}
.cat-stage.cat-count-2{grid-template-columns:repeat(2,minmax(210px,1fr))}
.cat-stage.cat-count-3{grid-template-columns:repeat(3,minmax(150px,1fr))}
.cat-stage.cat-count-4{grid-template-columns:repeat(2,minmax(175px,1fr));max-width:700px;margin:auto;width:100%}
.cat-stage.cat-count-5,.cat-stage.cat-count-6,.cat-stage.cat-count-7{grid-template-columns:repeat(3,minmax(130px,1fr));max-width:760px;margin:auto;width:100%}

.cat-card{aspect-ratio:1.02;padding:12px 12px 34px}.cat-card-svg{width:82%;height:82%;display:grid;place-items:center}.cat-card-svg svg{width:100%;height:100%;filter:drop-shadow(0 8px 7px rgba(36,74,92,.14))}.cat-card-caption{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);background:#fff2c7;border:2px solid #e5be66;border-radius:16px;padding:4px 12px;font-size:clamp(12px,1.05vw,16px);font-weight:1000;white-space:nowrap}
.cat-count-3 .cat-card{padding:8px 8px 28px}.cat-count-4 .cat-card{padding:7px 7px 27px}.cat-count-5 .cat-card,.cat-count-6 .cat-card,.cat-count-7 .cat-card{padding:5px 5px 24px}.cat-count-5 .cat-card-caption,.cat-count-6 .cat-card-caption,.cat-count-7 .cat-card-caption{font-size:12px;padding:3px 8px}

.material-title{font-size:clamp(14px,1.15vw,18px);font-weight:1000;color:#6b4a2c}.material-total{font-size:clamp(14px,1.1vw,17px);font-weight:900;color:#6b4a2c}.material-total b{color:#238bc1;font-size:1.2em}
.piece-rack{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:4px 5px;align-items:end;justify-items:center;padding:7px 3px 3px}.rack-item{display:flex;flex-direction:column;align-items:center;justify-content:end;min-width:0}.rack-piece{display:grid;place-items:center;filter:drop-shadow(0 5px 4px rgba(42,73,91,.14))}.rack-piece svg{width:100%;height:100%;overflow:visible}.rack-lg{width:58px;height:58px}.rack-md{width:48px;height:48px}.rack-sm{width:38px;height:38px}.rack-sq{width:42px;height:42px}.rack-para{width:50px;height:40px}.piece-no{margin-top:2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#ffeecb;color:#6b4a2c;font-weight:1000;font-size:13px;border:1px solid #a8d6ec}
.assembling-target svg{transition:opacity .3s}.rack-floating{background:linear-gradient(180deg,#fffdf4,#fff6e6);border:3px solid rgba(255,255,255,.9);border-radius:26px;padding:12px}.rack-flight{filter:drop-shadow(0 7px 8px rgba(49,78,96,.18))}
.pattern-strip{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center;font-size:clamp(24px,2.6vw,44px)}.pattern-strip>div{background:#fff9ec;border:2px solid #f0dcb8;border-radius:20px;padding:14px 12px;display:grid;gap:6px}.pattern-strip b{color:#234a68}.pattern-strip span{font-size:.68em;color:#e45151}.pattern-strip i{font-style:normal;color:#ed8a31;font-weight:1000}
.big-equation-line{font-size:clamp(40px,4.3vw,74px);font-weight:1000;white-space:nowrap}.direct-transform{display:grid;grid-template-columns:auto auto auto;gap:12px 18px;align-items:center;justify-content:center;font-size:clamp(34px,3.7vw,62px)}.direct-transform .transform-arrow{color:#ecd9ae;font-size:.8em}.direct-transform>span:nth-last-child(-n+5){white-space:nowrap}
@media(max-width:1200px){.cat-stage.cat-count-3{grid-template-columns:repeat(3,minmax(125px,1fr))}.cat-stage.cat-count-5,.cat-stage.cat-count-6,.cat-stage.cat-count-7{gap:8px}.rack-lg{width:48px;height:48px}.rack-md{width:40px;height:40px}.rack-sm{width:32px;height:32px}.rack-sq{width:35px;height:35px}.rack-para{width:42px;height:34px}}
@media(max-height:760px){.cat-stage{gap:7px;padding:4px}.cat-card{padding-top:4px}.cat-card-caption{bottom:4px}.material-slot{padding:7px}.piece-rack{padding:3px}.rack-lg{width:42px;height:42px}.rack-md{width:36px;height:36px}.rack-sm{width:28px;height:28px}.rack-sq{width:31px;height:31px}.rack-para{width:36px;height:28px}.piece-no{width:18px;height:18px;font-size:11px}.material-title,.material-total{font-size:12px}}


/* v1.5.1 验收修正：材料块放大、5-7只猫按行数压缩以完整入屏 */
.cat-stage{align-content:stretch;grid-auto-rows:minmax(0,1fr)}
.cat-stage.cat-count-1,.cat-stage.cat-count-2,.cat-stage.cat-count-3{align-content:center}
.cat-stage.cat-count-4{grid-template-rows:repeat(2,minmax(0,1fr))}
.cat-stage.cat-count-5,.cat-stage.cat-count-6{grid-template-rows:repeat(2,minmax(0,1fr))}
.cat-stage.cat-count-7{grid-template-rows:repeat(3,minmax(0,1fr))}

.cat-count-5>*:nth-child(4){grid-column:1;transform:translateX(50%);margin-left:0}.cat-count-5>*:nth-child(5){grid-column:2;transform:translateX(50%);margin-left:0}

.rack-lg{width:72px;height:72px}.rack-md{width:58px;height:58px}.rack-sm{width:46px;height:46px}.rack-sq{width:50px;height:50px}.rack-para{width:64px;height:46px}
.piece-rack{align-items:center}.rack-item{justify-content:center}.rack-piece svg{display:block}

/* v1.5.2 猫群必须完整收进工作台，不允许向下溢出 */

.cat-stage.cat-count-1{grid-template-columns:minmax(260px,390px)}
.cat-stage.cat-count-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cat-stage.cat-count-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cat-stage.cat-count-4{grid-template-columns:repeat(2,minmax(0,1fr))}
.cat-stage.cat-count-5,.cat-stage.cat-count-6,.cat-stage.cat-count-7{grid-template-columns:repeat(3,minmax(0,1fr))}
.cat-count-4 .cat-card,.cat-count-4 .material-slot,.cat-count-5 .cat-card,.cat-count-5 .material-slot,.cat-count-6 .cat-card,.cat-count-6 .material-slot,.cat-count-7 .cat-card,.cat-count-7 .material-slot{width:100%;height:100%;aspect-ratio:auto}

/* v1.5.3 5-7只时继续缩小猫本体，避免图形越出卡片 */

/* ===== v1.8：逐帧检查后的构图修正 ===== */
.question-main{max-width:96%;margin:auto;font-size:clamp(40px,4.1vw,66px);font-weight:1000;line-height:1.2;letter-spacing:.01em;text-align:center;text-wrap:balance}
.material-slot{padding:10px 10px 8px}.material-title{font-size:clamp(14px,1.12vw,18px);line-height:1.1}.material-total{font-size:clamp(18px,1.45vw,24px);font-weight:1000;line-height:1.05;margin-top:2px}.material-total b{font-size:1.35em}

/* ===== v2.1：猫群/材料卡自适应 + 连加框随内容伸缩 ===== */
/* 原则：完成状态最多三列；新材料出现时才进入下一档排版。 */

/* v2.3：第三环节数形结合——纯 CSS 3D 正方体。 */
.cube-lesson{width:min(1180px,98%);height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(260px,1fr) auto;gap:12px;align-items:stretch;font-size:18px}

.cube-field{position:relative;min-height:330px;border-radius:30px;border:3px solid #fff6e6;background:linear-gradient(180deg,#fbfeff,#f1f9fd);overflow:hidden;perspective:980px;box-shadow:inset 0 1px 0 #fff,0 12px 28px rgba(47,92,118,.08)}

.cube-token .cube-inner{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(30deg);animation:cubeFloat 3.8s ease-in-out infinite alternate}
.cube-token.is-settled .cube-inner{animation:none;transform:rotateX(-18deg) rotateY(30deg)}
.cube-face{position:absolute;inset:0;border:1px solid rgba(38,93,139,.18);backface-visibility:hidden;box-sizing:border-box}
.cube-face.front{background:linear-gradient(135deg,#7fc8ff,#5aa9ee);transform:translateZ(19px)}
.cube-face.back{background:#4e90ce;transform:rotateY(180deg) translateZ(19px)}

@keyframes cubeFloat{from{transform:rotateX(-20deg) rotateY(25deg) translateY(-2px)}to{transform:rotateX(-16deg) rotateY(35deg) translateY(2px)}}

/* ===== v2.5：第一环节3D小方块 + 第三环节先提问再数形结合 ===== */
/* 第一环节：把平面色块换成轻量3D正方体。只在“看图”初次出现时做落位动画，后续步骤保持稳定。 */
.block-set{gap:clamp(8px,1vw,14px)!important;perspective:700px;align-items:center;justify-items:center}

.math-cube .mc-front{background:linear-gradient(145deg,#8ed6ff,#fff6e6);transform:translateZ(calc(var(--cs)/2))}

.math-cube .mc-left{background:#6ab9ef;transform:rotateY(-90deg) translateZ(calc(var(--cs)/2))}

.group-tray{overflow:visible!important}

}



/* ===== v2.5：复习环节改为真正可见的等距立体方块 ===== */
.block-set{
  gap:clamp(8px,1vw,13px)!important;
  perspective:none!important;
  align-items:center;
  justify-items:center;
}
.review-cube3d{
  --cube-size:clamp(38px,3.8vw,58px);
  width:var(--cube-size);

.review-groups[data-groups="2"] .review-cube3d{--cube-size:clamp(48px,4.7vw,68px)}
.review-groups[data-groups="3"] .review-cube3d{--cube-size:clamp(42px,4.1vw,60px)}
.review-groups[data-groups="4"] .review-cube3d{--cube-size:clamp(34px,3.3vw,49px)}

/* 5个方块时：3个在上、2个在下且下排居中 */
.block-set.is-five{
  --half:calc(clamp(48px,4.7vw,68px) / 2);
  grid-template-columns:repeat(6,var(--half))!important;
  gap:12px 0!important;
}
.review-groups[data-groups="3"] .block-set.is-five{
  --half:calc(clamp(42px,4.1vw,60px) / 2);
}
.review-groups[data-groups="4"] .block-set.is-five{
  --half:calc(clamp(34px,3.3vw,49px) / 2);
}
.block-set.is-five > .review-cube3d{grid-column:span 2}
.block-set.is-five > .review-cube3d:nth-child(4){grid-column:2 / span 2}
.block-set.is-five > .review-cube3d:nth-child(5){grid-column:4 / span 2}

@media(max-width:1100px){
  .review-groups[data-groups="2"] .group-tray{min-width:190px;width:34%;}
  .review-groups[data-groups="3"] .group-tray{min-width:150px;width:28%;}
  .review-groups[data-groups="4"] .group-tray{min-width:126px;width:22%;}
}

.app-shell::before{width:210px;height:210px;right:2%;top:12%;background:rgba(118,208,236,.10);border-radius:42% 58% 56% 44%;filter:blur(.2px)}
.app-shell::after{width:270px;height:130px;left:-52px;bottom:5%;background:rgba(255,202,91,.11);border-radius:50%}

/* 顶部：品牌 + 三步课堂路线 */
.lesson-header{
  display:grid!important;grid-template-columns:minmax(210px,260px) minmax(0,1fr) minmax(150px,210px);
  gap:16px;align-items:center;justify-content:stretch;padding:0 18px;
}
.lesson-header::before{
  position:static!important;transform:none!important;content:"7 的乘法口诀"!important;
  display:flex;align-items:center;justify-content:center;min-height:52px;
  font-size:clamp(19px,1.55vw,26px)!important;font-weight:1000;color:#6b4a2c!important;
  letter-spacing:.03em;background:linear-gradient(180deg,#ffffff,#fff6e6)!important;
  border:2px solid #fff6e6!important;border-radius:22px!important;padding:7px 16px!important;
  box-shadow:0 9px 22px rgba(38,99,135,.10),inset 0 1px 0 white!important;
}
.lesson-header::after{
  content:"二年级数学 · 第40页";display:flex;justify-content:center;align-items:center;
  min-height:44px;color:#6b4a2c;font-size:14px;font-weight:900;letter-spacing:.04em;
  background:rgba(255,255,255,.72);border:1px solid rgba(154,202,226,.65);border-radius:999px;
}
.lesson-steps{
  width:100%!important;border:0!important;border-radius:0!important;overflow:visible!important;
  display:grid!important;grid-template-columns:1fr 1.38fr 1fr;gap:10px;
  background:transparent!important;box-shadow:none!important;
}
.lesson-step{
  min-height:52px;border:2px solid #fff6e6!important;border-radius:20px!important;
  background:rgba(255,255,255,.72)!important;color:#6b4a2c!important;
  box-shadow:0 8px 18px rgba(47,100,132,.07);transition:.22s ease;
}
.lesson-step:not(:last-child)::after{display:none!important}
.lesson-step:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(47,100,132,.10)}
.lesson-step .step-no{
  width:34px;height:34px;background:linear-gradient(145deg,#8dc9ef,#6aa8df)!important;
  border:3px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(46,105,145,.13);
}
.lesson-step.is-active{
  background:linear-gradient(180deg,#fff9e8,#ffe7a5)!important;border-color:#f0c65f!important;
  color:#83500e!important;box-shadow:0 12px 26px rgba(210,145,29,.14);
}
.lesson-step.is-active .step-no{background:linear-gradient(145deg,#ffc85d,#ff9f3c)!important;box-shadow:0 0 0 5px rgba(255,190,72,.18),0 5px 12px rgba(210,118,26,.18)!important}

/* 通用画板：更像教材绘本，不像后台卡片 */
.card-surface{
  border:2px solid rgba(130,188,217,.28)!important;border-radius:30px!important;
  box-shadow:var(--v3-shadow)!important;overflow:hidden;
}
.card-surface::selection{background:#ffe39a}
.panel-kicker,.board-kicker{color:#6b4a2c;font-size:clamp(16px,1.25vw,20px);letter-spacing:.02em}

/* 第一环节：分组像操作垫，数学区像练习本 */
.review-layout{grid-template-columns:55% 45%;gap:16px}
.review-visual{
  padding:24px 26px;background:
    radial-gradient(circle at 91% 10%,rgba(255,215,101,.32) 0 7%,transparent 21%),
    radial-gradient(circle at 11% 86%,rgba(124,211,240,.16) 0 11%,transparent 25%),
    linear-gradient(180deg,#fff3dc 0%,#fdf6e8 32%,#fffefa 100%)!important;
}
.review-visual::before{inset:12px;border:2px dashed rgba(70,145,183,.12);border-radius:22px}
.review-visual::after{
  content:"动手分一分"!important;right:24px;top:20px;color:#6b4a2c!important;background:#fff9e7!important;
  border:1px solid #f1d78e;padding:7px 13px!important;box-shadow:0 5px 12px rgba(147,104,24,.08)
}
.review-visual .panel-kicker{
  justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;
  background:#ffffff;border:2px solid #fff6e6;box-shadow:0 7px 14px rgba(44,102,135,.07);color:#6b4a2c;
}
.review-visual .panel-kicker::before{content:"✦";color:#ffae3f;font-size:18px}
.review-groups{padding:28px 12px 62px;gap:clamp(18px,2vw,30px)}
.group-tray{
  border:3px solid #9fd9f1!important;border-radius:30px 30px 42px 42px!important;
  background:linear-gradient(160deg,#ffffff 0%,#fff7e8 48%,#fff6e6 100%)!important;
  box-shadow:inset 0 -14px 0 rgba(79,156,195,.06),0 18px 28px rgba(38,91,123,.14)!important;
}
.group-tray::before{content:"";position:absolute;left:22%;right:22%;top:8px;height:5px;border-radius:999px;background:#fff6e6}
.group-tray::after{background:rgba(38,85,111,.10)!important;filter:blur(5px)!important}
.example-progress{gap:8px}.example-dot{width:10px;height:10px;background:#fff6e6}.example-dot.is-current{width:34px;background:linear-gradient(90deg,#ffbe48,#ff9840);box-shadow:0 3px 8px rgba(230,140,42,.18)}

.review-math{
  padding:26px 30px;background:
    linear-gradient(rgba(64,141,180,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(64,141,180,.045) 1px,transparent 1px),
    radial-gradient(circle at 92% 8%,rgba(255,210,100,.16),transparent 23%),
    linear-gradient(180deg,#fffdf8,#ffffff)!important;
  background-size:28px 28px,28px 28px,auto,auto!important;
}
.review-math::after{content:"";position:absolute;right:20px;top:20px;width:14px;height:14px;border-radius:50%;background:#ff7d9e;box-shadow:0 0 0 7px rgba(255,125,158,.12)}
.review-stage-title{
  font-size:clamp(18px,1.45vw,24px)!important;background:linear-gradient(180deg,#fff8ec,#fff6e6)!important;
  border:2px solid #fff6e6!important;color:#6b4a2c!important;padding:8px 20px!important;box-shadow:0 6px 14px rgba(50,105,139,.06)
}
.review-expression{color:#173a58;text-shadow:0 1px 0 white}
.micro-dot{height:7px}.micro-dot.is-current{background:linear-gradient(90deg,#ffc44d,#ff9a3d)}

/* 第二环节：教材页 + 工坊 + 数学板书 */
.textbook-table{
  border:2px solid #a9daf0!important;border-radius:28px!important;padding:12px 18px 15px!important;
  background:linear-gradient(180deg,#fff6e6 0%,#fffdf6 100%)!important;
  box-shadow:0 14px 28px rgba(47,103,135,.10)!important;
}
.table-title-row{margin-bottom:8px}.table-title-row .panel-kicker{color:#6b4a2c}
.textbook-table::before{content:"";position:absolute;left:28px;top:-6px;width:88px;height:16px;border-radius:8px;background:rgba(255,213,102,.56);transform:rotate(-2deg)}
.textbook-table::after{content:"教材同步填写"!important;right:100px;top:13px;background:#fff6e6!important;border:1px solid #fff6e6;color:#6b4a2c!important}
.book-grid{border:2px solid #66bfe9!important;border-radius:17px!important;box-shadow:0 7px 15px rgba(41,110,147,.08)!important}
.grid-label{background:linear-gradient(90deg,#fff6e6,#fff6e6)!important}.count-cell.is-current{background:#fff1bb!important}.result-cell.is-filled{background:#fff8d9!important}
.ghost-btn{
  display:inline-flex;align-items:center;gap:8px;border:2px solid #fff6e6!important;background:#fff!important;border-radius:15px!important;
  padding:7px 13px!important;box-shadow:0 6px 14px rgba(51,104,134,.07);color:#6b4a2c!important
}
.ghost-svg,.dock-svg{display:grid;place-items:center;width:20px;height:20px}.ghost-svg svg,.dock-svg svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.cat-workbench{
  border-radius:30px!important;background:
    radial-gradient(circle at 84% 10%,rgba(255,246,196,.88) 0 8%,transparent 23%),
    linear-gradient(180deg,#fff6e6 0 18%,#90daef 18% 52%,#d7a062 52% 100%)!important;
}
.cat-workbench::before{inset:12px;border:2px dashed rgba(30,105,142,.10);border-radius:22px}
.cat-workbench::after{height:6px!important;top:52%!important;background:rgba(105,64,24,.11)!important;box-shadow:0 11px 24px rgba(99,61,24,.14)!important}
.workbench-head .panel-kicker{background:rgba(255,255,255,.80);border:1px solid rgba(139,197,221,.65);border-radius:999px;padding:7px 13px;color:#6b4a2c}
.piece-audit{background:#fff9df!important;border:1px solid #efd894;color:#6d6127!important;box-shadow:0 6px 14px rgba(132,101,34,.08)!important}
.cat-card,.material-slot,.cat-slot{
  border:3px solid rgba(255,255,255,.96)!important;background:linear-gradient(160deg,#fff 0%,#f3fbff 52%,#fff6e6 100%)!important;
  box-shadow:inset 0 0 0 2px rgba(107,168,198,.20),0 16px 28px rgba(38,82,106,.15)!important;
}
.cat-card::after,.material-slot::after{content:"";position:absolute;left:18%;right:18%;bottom:10%;height:10px;border-radius:50%;background:rgba(33,76,98,.07);filter:blur(5px);z-index:0}
.cat-card-svg,.piece-rack,.cat-card-caption,.material-title,.material-total{position:relative;z-index:2}
.cat-card-caption,.slot-caption{background:linear-gradient(180deg,#fff7cf,#ffe9a5)!important;border-color:#edc85d!important;color:#76500e!important;box-shadow:0 4px 10px rgba(139,97,23,.08)}
.material-slot{background:linear-gradient(180deg,#fffdf4 0%,#f1faff 100%)!important}
.material-title{color:#6b4a2c!important}.piece-no{background:#fff6e6!important;border:2px solid #a8d9ef!important;box-shadow:0 3px 8px rgba(39,97,129,.09)}

.math-board{
  border-radius:30px!important;background:
    linear-gradient(rgba(55,125,164,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(55,125,164,.045) 1px,transparent 1px),
    radial-gradient(circle at 91% 8%,rgba(255,218,112,.18),transparent 21%),
    linear-gradient(180deg,#fffefa,#fff)!important;
  background-size:30px 30px,30px 30px,auto,auto!important;
}
.math-board::before{inset:12px;border:2px dashed rgba(78,145,179,.11);border-radius:22px}
.math-board::after{width:15px;height:15px;right:22px;top:20px;background:#ff7fa3!important;box-shadow:0 0 0 7px rgba(255,127,163,.12)!important}
.board-kicker{background:#fff6e6!important;border:2px solid #fff6e6!important;color:#6b4a2c!important;padding:8px 17px!important;box-shadow:0 5px 12px rgba(44,101,134,.05)}
.board-main{color:#173a58;text-shadow:0 1px 0 white}

/* 推算记录：像课堂板书表，不像后台数据表 */
.relation-ledger{border:2px solid #fff6e6!important;border-radius:22px!important;overflow:hidden!important;box-shadow:0 10px 22px rgba(41,91,121,.08)!important;background:#fff}
.ledger-title{background:linear-gradient(90deg,#fff6e6,#fff2c8)!important;color:#6b4a2c!important}
.ledger-head{background:#eef8fd!important;color:#6b4a2c!important}
.ledger-cell{background:#fff!important;border-color:#ecd9ae!important}.ledger-cell.is-current{background:#fff6d6!important}

/* 第三环节：挑战卡更有舞台感 */
.practice-wrap{
  position:relative;border:2px solid rgba(137,190,216,.28)!important;border-radius:30px!important;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,221,120,.24) 0 12%,transparent 34%),
    linear-gradient(rgba(63,133,171,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(63,133,171,.035) 1px,transparent 1px),
    linear-gradient(145deg,#fffdf7,#f6fbff)!important;
  background-size:auto,32px 32px,32px 32px,auto!important;
  box-shadow:var(--v3-shadow)!important;
}
.practice-wrap::before,.practice-wrap::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.practice-wrap::before{width:82px;height:82px;left:5%;top:10%;background:rgba(122,207,237,.12)}
.practice-wrap::after{width:54px;height:54px;right:7%;bottom:12%;background:rgba(255,192,73,.15)}
.practice-kicker{justify-self:center;padding:9px 18px;border:2px solid #fff6e6;border-radius:999px;background:#fff;color:#6b4a2c!important;box-shadow:0 6px 14px rgba(45,98,129,.06)}
.practice-main{position:relative;z-index:2;color:#173a58;text-shadow:0 2px 0 white}.practice-support{position:relative;z-index:2}
.cube-summary-card{border:3px solid #fff6e6!important;background:linear-gradient(180deg,#fff,#f6fbff)!important;box-shadow:0 14px 30px rgba(40,89,116,.10)!important}

/* 底部教师控制：做成悬浮遥控器 */
.teacher-dock{
  width:max-content;max-width:96vw;justify-self:center;margin:auto;padding:7px 10px;border-radius:24px;
  background:rgba(255,255,255,.78);border:1px solid rgba(159,199,221,.48);box-shadow:0 12px 30px rgba(42,83,108,.12);
  backdrop-filter:blur(12px);gap:9px!important;
}
.teacher-dock::before{content:"教师控制";padding:0 6px;color:#8a6a4a!important;font-size:12px!important}
.dock-btn{
  height:50px!important;border:2px solid #fff6e6!important;background:#fff!important;border-radius:17px!important;
  box-shadow:0 6px 14px rgba(45,90,116,.07)!important;color:#6b4a2c!important;padding:0 18px!important;
}
.dock-btn:hover{transform:translateY(-2px);box-shadow:0 10px 18px rgba(45,90,116,.11)!important}
.dock-primary{background:linear-gradient(180deg,#ffd36b,#ffb43d)!important;border-color:#efa735!important;color:#754905!important;box-shadow:0 8px 18px rgba(222,143,30,.18)!important}
.dock-primary:hover{box-shadow:0 12px 22px rgba(222,143,30,.23)!important}
.dock-icon{width:50px!important;padding:0!important}.dock-svg{width:21px;height:21px}.state-counter{background:#f7fbfd!important;border:2px solid #fff6e6!important;color:#6b4a2c!important;border-radius:16px!important;min-width:220px!important}

/* 小屏适配 */
@media(max-width:1180px){
  .lesson-header{grid-template-columns:190px minmax(0,1fr)}.lesson-header::after{display:none}.lesson-header::before{font-size:18px!important}.lesson-step{font-size:15px}
  .teacher-dock::before{display:none}.state-counter{min-width:170px!important}
}
@media(max-height:760px){
  .app-shell{grid-template-rows:66px minmax(0,1fr) 62px;padding-top:8px}.lesson-header{grid-template-columns:190px minmax(0,1fr);gap:10px}.lesson-header::after{display:none}.lesson-header::before{min-height:44px;padding:5px 12px!important;font-size:18px!important}.lesson-step{min-height:44px}.lesson-step .step-no{width:29px;height:29px}
  .teacher-dock{padding:5px 8px}.dock-btn{height:44px!important}.state-counter{padding:8px 12px}
}


/* ===== 绘本美化层 v1 ===== */
/* 纸感卡片：柔和纸纹 + 顶部高光 + 立体纸边 */
.card-surface{
  background:
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27140%27%20height%3D%27140%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27/%3E%3C/filter%3E%3Crect%20width%3D%27140%27%20height%3D%27140%27%20filter%3D%27url%28%2523n%29%27%20opacity%3D%270.5%27/%3E%3C/svg%3E"),
    linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.62))!important;
  border:2px solid rgba(150,200,225,.35)!important;
  border-radius:34px!important;
  box-shadow:
    0 2px 0 rgba(255,255,255,.85) inset,
    0 -2px 0 rgba(110,170,200,.08) inset,
    0 22px 44px rgba(43,74,99,.16),
    0 6px 14px rgba(43,74,99,.08)!important;
}
.card-surface::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 22%);
  opacity:.55;
}
/* 顶部导航：绘本卡片串联感 */
.lesson-steps{
  background:rgba(255,255,255,.55)!important;
  backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important;
  border:2px solid rgba(150,200,225,.4)!important;
  border-radius:32px!important;
  box-shadow:0 16px 36px rgba(43,74,99,.12)!important;
}
.lesson-step.is-active{
  background:linear-gradient(180deg,#fff9e4,#ffe3a0)!important;
  border-radius:22px!important;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.9),
    inset 0 -3px 0 rgba(214,158,44,.25),
    0 10px 20px rgba(210,145,29,.16)!important;
  transform:translateY(-2px);
}
.lesson-step.is-active .step-no{
  box-shadow:0 0 0 5px rgba(245,184,63,.20),0 3px 6px rgba(190,120,20,.25)!important;
}
/* 底部遥控器：圆润胶囊 + 立体按钮 */
.teacher-dock{
  background:rgba(255,255,255,.6)!important;
  backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important;
  border:2px solid rgba(150,200,225,.4)!important;
  border-radius:30px!important;
  padding:10px 18px!important;
  box-shadow:0 14px 32px rgba(43,74,99,.14)!important;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.dock-btn{
  border-radius:22px!important;
  border:1px solid rgba(130,185,215,.5)!important;
  background:linear-gradient(180deg,#fff,#eef7fc)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 14px rgba(46,82,108,.12)!important;
  transition:transform .15s ease,box-shadow .15s ease!important;
}
.dock-btn:hover{
  transform:translateY(-2px)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 20px rgba(46,82,108,.16)!important;
}
.dock-btn:active{transform:translateY(0) scale(.97)!important}
/* 环节tab未选中态更柔和 */
.lesson-step:not(.is-active){
  border-radius:20px;
}
.lesson-step:not(.is-active):hover{
  background:rgba(255,255,255,.5);
  border-radius:20px;
}
/* 全局：主标题带一点绘本质感 */

/* ===== 绘本美化层 v2：卡片场景化 + 装饰 ===== */
/* 内容区容器：留出更多背景露边 */
.app-main{{
  padding:2px 6px;
}}
/* 卡片顶部绘本页眉：复习视觉=淡蓝，复习数学=奶油，七巧板工作台=木色，数学板书=纸白 */
.review-visual.card-surface{{
  background:
    linear-gradient(180deg,rgba(214,238,252,.95) 0,rgba(214,238,252,0) 30px),
    linear-gradient(180deg,rgba(255,255,255,.76),rgba(255,255,255,.60))!important;
}}
.review-math.card-surface{{
  background:
    linear-gradient(180deg,rgba(255,241,206,.95) 0,rgba(255,241,206,0) 30px),
    linear-gradient(180deg,rgba(255,255,255,.76),rgba(255,255,255,.60))!important;
}}
.cat-workbench.card-surface{{
  background:
    linear-gradient(180deg,rgba(255,236,214,.95) 0,rgba(255,236,214,0) 30px),
    linear-gradient(180deg,rgba(255,255,255,.76),rgba(255,255,255,.60))!important;
}}
.math-board.card-surface{{
  background:
    linear-gradient(180deg,rgba(244,251,255,.95) 0,rgba(244,251,255,0) 30px),
    linear-gradient(180deg,rgba(255,255,255,.76),rgba(255,255,255,.60))!important;
}}
.practice-wrap.card-surface{{
  background:
    linear-gradient(180deg,rgba(255,236,214,.95) 0,rgba(255,236,214,0) 30px),
    linear-gradient(180deg,rgba(255,255,255,.76),rgba(255,255,255,.60))!important;
}}
/* 卡片内的区域标题条：绘本贴纸感 */
.card-surface .section-title,
.card-surface [class*="title"],
.review-stage-title,
.area-title{{
  display:inline-flex;align-items:center;gap:8px;
}}
.review-stage-title::before{{
  content:"";width:14px;height:14px;border-radius:50%;
  background:linear-gradient(135deg,#8ecdf0,#4e9fd6);
  box-shadow:0 0 0 4px rgba(126,197,233,.18);
}}
/* 提问卡：云朵气泡尾巴（右侧卡片底部） */
/* 遥控器内提示文字更轻 */
.teacher-dock::before{{
  color:#8a6a4a!important;font-size:12px!important;
}}

/* 导航图标贴纸 */
.lesson-step .step-no{{
  width:54px;height:54px;border-radius:18px;
  background-size:cover;background-position:center;
  border:2px solid rgba(255,255,255,.95);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 12px rgba(46,82,108,.18);
  position:relative;flex:0 0 auto;
}}
.lesson-step.is-active .step-no{{
  border-color:#f5cf7e;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 0 4px rgba(245,184,63,.22),0 6px 14px rgba(190,120,20,.22);
}}
.step-num{{
  position:absolute;top:-6px;right:-6px;width:21px;height:21px;border-radius:50%;
  background:linear-gradient(180deg,#ffd66b,#f59f2e);
  color:#fff;font-size:12px;font-weight:1000;font-style:normal;
  display:grid;place-items:center;
  box-shadow:0 2px 5px rgba(150,90,10,.35),inset 0 1px 0 rgba(255,255,255,.5);
  border:1.5px solid #fff;
}}
.lesson-step{{gap:12px}}

/* ========== 暖色绘本覆盖层（v2 重做） ========== */

  --ink:#5d4037!important;             /* 主文字：深可可暖棕 */
  --ink-soft:#8a6a5b!important;        /* 次级文字：暖棕灰 */
  --v3-navy:#5d4037!important;
  --v3-line:#f0dcc0!important;
  --v3-shadow:0 16px 38px rgba(130,88,52,.16),0 4px 12px rgba(130,88,52,.10)!important;
  --border:rgba(190,150,110,.25)!important;
  --shadow:0 16px 40px rgba(130,88,52,.14)!important;
}
body{
  background:#fdf4e3!important;
  color:#5d4037!important;
}

/* 卡片：奶油纸感 */
.card-surface{
  background:
    linear-gradient(180deg,rgba(255,246,228,.60),rgba(255,238,214,.44)),
    url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='140'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='140'%20height='140'%20filter='url(%23n)'%20opacity='0.04'/%3E%3C/svg%3E"),
    rgba(255,238,214,.48)!important;
  backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important;
  border:3px solid rgba(226,180,120,.55)!important;
  border-radius:34px!important;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.9),
    inset 0 -2px 0 rgba(196,150,96,.10),
    0 22px 44px rgba(130,88,52,.16),
    0 6px 14px rgba(130,88,52,.09)!important;
}
/* 卡片顶部绘本页眉：暖色系 */
.review-visual.card-surface{
  background:
    linear-gradient(180deg,rgba(255,232,200,.88) 0,rgba(255,232,200,0) 40px),
    linear-gradient(180deg,rgba(255,246,228,.62),rgba(255,238,214,.46))!important;
}
.review-math.card-surface{
  background:
    linear-gradient(180deg,rgba(255,242,214,.88) 0,rgba(255,242,214,0) 40px),
    linear-gradient(180deg,rgba(255,246,228,.62),rgba(255,238,214,.46))!important;
}
.cat-workbench.card-surface{
  background:
    linear-gradient(180deg,rgba(255,236,214,.88) 0,rgba(255,236,214,0) 40px),
    linear-gradient(180deg,rgba(255,246,228,.62),rgba(255,238,214,.46))!important;
}
.math-board.card-surface{
  background:
    linear-gradient(180deg,rgba(255,246,226,.88) 0,rgba(255,246,226,0) 40px),
    linear-gradient(180deg,rgba(255,246,228,.62),rgba(255,238,214,.46))!important;
}
.practice-wrap.card-surface{
  background:
    linear-gradient(180deg,rgba(255,236,214,.88) 0,rgba(255,236,214,0) 40px),
    linear-gradient(180deg,rgba(255,246,228,.62),rgba(255,238,214,.46))!important;
}
.textbook-table.card-surface{
  background:
    linear-gradient(180deg,rgba(255,246,226,.88) 0,rgba(255,246,226,0) 40px),
    linear-gradient(180deg,rgba(255,246,228,.62),rgba(255,238,214,.46))!important;
}
/* 所有标题/提示文字 → 暖棕 */
.panel-kicker,.review-stage-title,.board-kicker,.practice-kicker,
.workbench-head,.table-title-row,.material-title,.material-total,
.cat-card-caption,.piece-no,.transform-note,.step-cross-label,
.group-value-tag,.state-counter,.example-progress,.section-label{
  color:#7a5230!important;
}
/* 导航：暖色站点条 */
.lesson-steps{
  background:rgba(255,248,236,.72)!important;
  backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important;
  border:2px solid rgba(222,183,136,.5)!important;
  border-radius:34px!important;
  box-shadow:0 14px 32px rgba(130,88,52,.14)!important;
}
.lesson-step{color:#8a5a33!important}
.lesson-step.is-active{
  background:linear-gradient(180deg,#fff3d6,#ffd894)!important;
  border-radius:24px!important;
  color:#7a4a12!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 0 rgba(214,158,44,.3),0 10px 22px rgba(200,130,30,.18)!important;
  transform:translateY(-2px);
}
/* 遥控器：暖色胶囊 */
.teacher-dock{
  background:rgba(255,248,236,.74)!important;
  backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important;
  border:2px solid rgba(222,183,136,.5)!important;
  border-radius:32px!important;
  padding:9px 20px!important;
  box-shadow:0 14px 32px rgba(130,88,52,.16)!important;
}
.teacher-dock::before{color:#a67c52!important;font-size:12px!important}
/* 糖果色按钮 */
.dock-btn{
  border-radius:24px!important;
  border:2px solid rgba(255,255,255,.9)!important;
  background:linear-gradient(180deg,#ffe9c4,#ffd9a0)!important;
  color:#7a4a12!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 0 rgba(224,160,80,.3),0 6px 14px rgba(180,120,50,.16)!important;
  transition:transform .16s ease,box-shadow .16s ease!important;
}
.dock-btn:hover{
  transform:translateY(-2px) scale(1.02)!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 10px 22px rgba(180,120,50,.22)!important;
}
.dock-btn:active{transform:translateY(0) scale(.96)!important}
/* 数字/算式外层框：暖色纸感 */
.addition-builder,.cat-addition-builder,.cross-board,.step-cross-card,
.transform-row,.phrase-bridge .addition-small,.pattern-strip>div{
  background:linear-gradient(180deg,#fffaf0,#fff3dd)!important;
  border-color:#ecd9ae!important;
}
/* 教材表格单元格暖化 */
.textbook-table .cell,.textbook-table td,.table-cell{
  border-color:#e8d3ac!important;
  color:#6b4a2c!important;
}
/* 通用边框暖化 */
.ghost-btn,.state-counter,.mini-cross-label,.piece-no{
  border-color:#e2c9a0!important;
}

/* ========== 可爱增强层（按钮/控件卡通化） ========== */
/* 主按钮：糖果胶囊+果冻弹跳 */
.dock-btn{
  min-width:92px!important;
  height:54px!important;
  padding:0 24px!important;
  border-radius:28px!important;
  border:2.5px solid rgba(255,255,255,.95)!important;
  background:linear-gradient(180deg,#ffedc9 0%,#ffd79e 100%)!important;
  color:#7a4a12!important;
  font-weight:800!important;
  font-size:clamp(15px,1.4vw,19px)!important;
  letter-spacing:.03em!important;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.95),
    inset 0 -4px 0 rgba(216,152,72,.35),
    0 7px 0 #e0a45e,
    0 12px 22px rgba(180,118,50,.22)!important;
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease!important;
}
.dock-btn:hover{
  transform:translateY(-3px) scale(1.04)!important;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.95),
    inset 0 -4px 0 rgba(216,152,72,.35),
    0 10px 0 #e0a45e,
    0 18px 30px rgba(180,118,50,.28)!important;
  filter:brightness(1.05)!important;
}
.dock-btn:active{
  transform:translateY(3px) scale(.97)!important;
  box-shadow:
    inset 0 3px 0 rgba(216,152,72,.35),
    0 3px 0 #e0a45e,
    0 6px 12px rgba(180,118,50,.2)!important;
}
/* 上一步/下一步箭头变圆钮 */
.dock-btn.dock-prev,.dock-btn.dock-next{
  background:linear-gradient(180deg,#fff0d2,#ffdba6)!important;
}
/* 教师控制栏 */
.teacher-dock{
  border-radius:999px!important;
  padding:10px 26px!important;
  background:rgba(255,248,236,.82)!important;
  box-shadow:0 10px 0 rgba(222,183,136,.55),0 20px 40px rgba(130,88,52,.2)!important;
  border:2.5px solid #f3e2c2!important;
}
/* 导航：贴纸站点 */
.lesson-steps{
  border-radius:999px!important;
  padding:8px 10px!important;
  gap:6px!important;
  background:rgba(255,248,236,.78)!important;
  box-shadow:0 6px 0 rgba(222,183,136,.5),0 16px 32px rgba(130,88,52,.16)!important;
  border:2.5px solid #f3e2c2!important;
}
.lesson-step{
  border-radius:999px!important;
  padding:10px 20px!important;
  font-weight:800!important;
  transition:transform .14s ease!important;
}
.lesson-step:hover{transform:translateY(-2px)!important}
.lesson-step.is-active{
  background:linear-gradient(180deg,#ffe9a8,#ffc94d)!important;
  border:2px solid #fff!important;
  color:#7a4a12!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(212,156,40,.35),0 6px 14px rgba(200,130,30,.25)!important;
}
/* 进度计数：糖果气泡 */
.state-counter,.example-progress{
  border-radius:999px!important;
  background:linear-gradient(180deg,#fff0d2,#ffe0b0)!important;
  border:2px solid #f3dcb6!important;
  color:#8a5a22!important;
  padding:6px 16px!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 4px 0 rgba(216,168,96,.4)!important;
  font-weight:800!important;
}
/* 面板小标题：圆贴纸 */
.panel-kicker,.board-kicker,.practice-kicker,.section-label{
  display:inline-block!important;
  background:linear-gradient(180deg,#ffe3b0,#ffcf7a)!important;
  color:#7a4a12!important;
  border-radius:16px!important;
  padding:6px 16px!important;
  border:2px solid #fff!important;
  box-shadow:0 4px 0 rgba(214,152,72,.4),0 8px 16px rgba(180,118,50,.14)!important;
  font-weight:900!important;
  letter-spacing:.06em!important;
}
/* 大标题暖棕+描边感 */
.review-stage-title,.workbench-head,.table-title-row{
  color:#6b3f1d!important;
  font-weight:1000!important;
  text-shadow:0 2px 0 rgba(255,255,255,.9),0 3px 8px rgba(180,118,50,.18)!important;
}
/* 重置/刷新小圆钮 */
.dock-btn.dock-reset{
  border-radius:50%!important;
  min-width:46px!important;
  width:46px!important;
  height:46px!important;
  padding:0!important;
  background:linear-gradient(180deg,#fff0d2,#ffdba6)!important;
}
/* 猫卡/材料卡：奶油立体 */
.cat-card,.material-slot,.phrase-bridge,.step-cross-card{
  border-radius:26px!important;
  border:2.5px solid #f0dcc0!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 10px 20px rgba(130,88,52,.12)!important;
  background:linear-gradient(180deg,#fffaf0,#fff3dd)!important;
}
/* 表格圆角化 */
.textbook-table{
  border-radius:22px!important;
  overflow:hidden!important;
  border:2.5px solid #f0dcc0!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 12px 24px rgba(130,88,52,.12)!important;
}
.textbook-table .cell,.textbook-table td,.table-cell{
  border-radius:10px!important;
  background:linear-gradient(180deg,#fffaf0,#fff3dd)!important;
  font-weight:800!important;
}
/* 算式框：奶油圆角 */
.addition-builder,.cat-addition-builder,.cross-board,.transform-row{
  border-radius:24px!important;
  border:2.5px solid #f0dcc0!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 16px rgba(130,88,52,.1)!important;
}
/* 数学对象标签：糖果 */
.group-value-tag,.mini-cross-label{
  border-radius:14px!important;
  border:2px solid #fff!important;
  box-shadow:0 3px 0 rgba(190,130,60,.3)!important;
  font-weight:800!important;
}
/* 短语桥/箭头 */
.transform-note,.phrase-bridge .addition-small{
  border-radius:14px!important;
  background:#ffe9c4!important;
  color:#7a4a12!important;
  font-weight:800!important;
}
/* 滚动条隐藏但可滚动（投屏整洁） */
::-webkit-scrollbar{width:0!important;height:0!important}

/* ========== 材料架：用户手动布局（两排散开，任意尺寸不重叠） ========== */
.material-slot .piece-rack{
  position:relative!important;display:block!important;
  height:100%!important;width:auto!important;max-width:100%!important;
  aspect-ratio:86/86!important;margin:0 auto!important;
  padding:0!important;gap:0!important;
  flex:none!important;
}
.material-slot .rack-item{
  position:absolute!important;
  display:grid!important;grid-template-rows:auto minmax(0,1fr)!important;
  justify-items:center!important;align-items:center!important;
  margin:0!important;padding:0!important;
  transform:none!important;flex:none!important;
  overflow:visible!important;
}
.material-slot .rack-item .piece-no{
  grid-row:1!important;justify-self:center!important;align-self:center!important;
  position:static!important;margin:0 0 1px!important;
  width:clamp(16px,7cqw,28px)!important;height:clamp(16px,7cqw,28px)!important;
  font-size:clamp(9px,3.6cqw,15px)!important;
  z-index:3!important;
}
.material-slot .rack-item .rack-piece{
  grid-row:2!important;justify-self:center!important;align-self:center!important;
  position:relative!important;margin:0!important;transform:none!important;
  width:100%!important;height:100%!important;
  max-width:none!important;max-height:none!important;
  min-width:0!important;min-height:0!important;
}
.material-slot .rack-item .rack-piece svg{width:100%!important;height:100%!important}
.material-slot::after{background:rgba(139,106,74,.08)!important;filter:blur(5px)!important}

/* 材料架适配修复：七块与编号共用118×118坐标，取宽高较小值等比缩放。 */
#app .material-slot,.material-slot.rack-floating{
  grid-template-rows:minmax(0,1fr) 30px!important;
}
@media(max-height:760px){
  #app .material-slot,.material-slot.rack-floating{grid-template-rows:minmax(0,1fr) 26px!important}
}
#app .material-slot .piece-rack,
.material-slot.rack-floating .piece-rack{
  container-type:size!important;position:relative!important;
  display:block!important;width:100%!important;height:100%!important;
  min-width:0!important;min-height:0!important;max-width:100%!important;
  aspect-ratio:auto!important;margin:0!important;padding:0!important;
  gap:0!important;flex:none!important;overflow:visible!important;
}
.material-slot .piece-rack .rack-layout{
  --rack-unit:calc(min(100cqw,100cqh) / 118);
  position:absolute;left:50%;top:50%;
  width:min(100cqw,100cqh);height:min(100cqw,100cqh);
  transform:translate(-50%,-50%);pointer-events:none;
}
.material-slot .piece-rack .rack-layout .rack-item{
  display:grid!important;grid-template-rows:calc(12 * var(--rack-unit)) minmax(0,1fr)!important;
  align-items:center!important;justify-items:center!important;
  min-width:0!important;min-height:0!important;gap:0!important;
  margin:0!important;padding:0!important;transform:none!important;
}
.material-slot .piece-rack .rack-layout .piece-no{
  position:static!important;grid-row:1!important;grid-column:1!important;
  width:min(24px,calc(10 * var(--rack-unit)))!important;
  height:min(24px,calc(10 * var(--rack-unit)))!important;
  font-size:min(14px,calc(6.5 * var(--rack-unit)))!important;
  min-width:0!important;min-height:0!important;margin:0!important;
  border-width:min(1.5px,calc(.7 * var(--rack-unit)))!important;
  line-height:1!important;align-self:center!important;justify-self:center!important;
}
.material-slot .piece-rack .rack-layout .rack-item .rack-piece{
  grid-row:2!important;grid-column:1!important;
  width:100%!important;height:100%!important;
  min-width:0!important;min-height:0!important;max-width:none!important;max-height:none!important;
  margin:0!important;padding:0!important;transform:none!important;
}
.material-slot .piece-rack .rack-layout .rack-piece svg{
  display:block!important;width:100%!important;height:100%!important;
  overflow:visible!important;
}

<script>
window.LESSON_DATA = {
  reviewExamples: [
    {groups:3, each:2},
    {groups:2, each:3},
    {groups:4, each:2},
    {groups:3, each:4},
    {groups:2, each:5}
  ],
  chants: {
    1:'一七得七',
    2:'二七十四',
    3:'三七二十一',
    4:'四七二十八',
    5:'五七三十五',
    6:'六七四十二',
    7:'七七四十九'
  }
};


(function(){
  const COLORS={pink:'#ed84aa',cyan:'#17afc2',green:'#94ca5c',yellow:'#f1ef8b',orange:'#f59939',red:'#ec4650',purple:'#9a549f'};
  const pieces=[
    {id:'smallPink', fill:COLORS.pink, points:'1,1 1,22 11,12'},
    {id:'smallCyan', fill:COLORS.cyan, points:'24,1 14,11 24,22'},
    {id:'squareGreen', fill:COLORS.green, points:'13,12 1,23 12,35 24,23'},
    {id:'mediumYellow', fill:COLORS.yellow, points:'25,24 9,41 25,58'},
    {id:'largeOrange', fill:COLORS.orange, points:'26,25 26,71 49,49'},
    {id:'largeRed', fill:COLORS.red, points:'49,50 17,82 48,83'},
    {id:'parallelogramPurple', fill:COLORS.purple, points:'52,82 74,82 84,72 62,72'}
  ];
  const scatter={
    smallPink:'translate(28px,24px) rotate(-20deg)',
    smallCyan:'translate(30px,38px) rotate(24deg)',
    squareGreen:'translate(24px,18px) rotate(18deg)',
    mediumYellow:'translate(-12px,-10px) rotate(-18deg)',
    largeOrange:'translate(-22px,18px) rotate(22deg)',
    largeRed:'translate(18px,-18px) rotate(-17deg)',
    parallelogramPurple:'translate(-30px,-24px) rotate(14deg)'
  };
  function svgMarkup(instanceId){
    return `<svg class="tangram-cat" viewBox="0 0 86 86" role="img" aria-label="一只由7块组成的七巧板猫" data-piece-count="7">${pieces.map((p,i)=>`<polygon class="tg-piece" data-piece="${p.id}" data-index="${i}" fill="${p.fill}" points="${p.points}"></polygon>`).join('')}</svg>`;
  }
  function mount(el){
    el.innerHTML=svgMarkup();
    const svg=el.querySelector('svg');
    const count=svg.querySelectorAll('.tg-piece').length;
    if(count!==7){throw new Error(`七巧板数据错误：应为7块，实际${count}块`)}
    return svg;
  }
  function setScattered(svg, immediate=false){
    svg.querySelectorAll('.tg-piece').forEach((piece,i)=>{
      if(immediate) piece.style.transition='none';
      piece.style.transform=scatter[piece.dataset.piece];
      piece.style.opacity='1';
      if(immediate){void piece.getBoundingClientRect();piece.style.transition='';}
    });
  }
  function assemble(svg){
    svg.querySelectorAll('.tg-piece').forEach((piece,i)=>{
      piece.style.transitionDelay=`${i*45}ms`;
      piece.classList.add('is-glowing');
      piece.style.transform='none';
      setTimeout(()=>piece.classList.remove('is-glowing'),760+i*30);
    });
  }
  function setAssembled(svg, immediate=false){
    svg.querySelectorAll('.tg-piece').forEach(piece=>{
      if(immediate) piece.style.transition='none';
      piece.style.transitionDelay='0ms';
      piece.style.transform='none';
      piece.classList.remove('is-glowing');
      if(immediate){void piece.getBoundingClientRect();piece.style.transition='';}
    });
  }
  function resetDelays(svg){svg.querySelectorAll('.tg-piece').forEach(p=>p.style.transitionDelay='0ms')}
  window.TANGRAM={mount,setScattered,assemble,setAssembled,resetDelays,pieces};
})();


(function(){
  function getReviewStages(index){
    const e=LESSON_DATA.reviewExamples[index];
    // 逻辑一致性优先：每一道复习题都完整经历
    // 看图 → 标出每组数量 → 一个一个搬进连加算式 → 求和 → 说“几个几” → 交叉写乘法。
    // 不再从第3题开始跳过连加动画，避免学生刚建立的转化链被打断。
    return ['look','labels',...Array.from({length:e.groups},(_,i)=>`add${i+1}`),'sum','phrase','mulStart','mulEach','mulGroups','mulFinal'];
  }
  function catLessonStates(n){
    const prefix=`cat${n}`;
    const states=[`${prefix}Question`,`${prefix}Material`,`${prefix}Assemble`,`${prefix}Phrase`];
    if(n===2) states.push(`${prefix}AddFirst`,`${prefix}AddSecond`,`${prefix}AddSum`);
    else states.push(`${prefix}AddBuild`,`${prefix}AddSum`);
    states.push(`${prefix}Table`,`${prefix}MulStart`,`${prefix}MulEach`,`${prefix}MulGroups`,`${prefix}Multiply`,`${prefix}ChantBlank`,`${prefix}ChantReveal`);
    return states;
  }
  const tangramStates=[
    'oneQuestion','onePhrase','oneMulStart','oneMulEach','oneMulGroups','oneMultiply','oneChant',
    ...catLessonStates(2),
    ...catLessonStates(3),'pattern123',
    ...catLessonStates(4),
    ...catLessonStates(5),
    ...catLessonStates(6),
    ...catLessonStates(7),
    'summary7'
  ];
  const practiceStates=['q2','a2','compareQuestion','compare27','compare72','compare','q3','a3','q1','a1'];
  window.LESSON_STATE={
    screen:'review',
    reviewIndex:0,
    reviewStage:0,
    tangramIndex:0,
    practiceIndex:0,
    tangramStates,
    practiceStates,
    getReviewStages,
    move(delta){
      if(this.screen==='review'){
        let stages=getReviewStages(this.reviewIndex);
        const nextStage=this.reviewStage+delta;
        if(nextStage>=0 && nextStage<stages.length){this.reviewStage=nextStage;return;}
        if(nextStage>=stages.length){
          if(this.reviewIndex<LESSON_DATA.reviewExamples.length-1){this.reviewIndex++;this.reviewStage=0;return;}
          this.screen='tangram';this.tangramIndex=0;return;
        }
        if(nextStage<0 && this.reviewIndex>0){this.reviewIndex--;this.reviewStage=getReviewStages(this.reviewIndex).length-1;return;}
      }else if(this.screen==='tangram'){
        const next=this.tangramIndex+delta;
        if(next>=0 && next<tangramStates.length){this.tangramIndex=next;return;}
        if(next>=tangramStates.length){this.screen='practice';this.practiceIndex=0;return;}
        if(next<0){this.screen='review';this.reviewIndex=LESSON_DATA.reviewExamples.length-1;this.reviewStage=getReviewStages(this.reviewIndex).length-1;return;}
      }else if(this.screen==='practice'){
        const next=this.practiceIndex+delta;
        if(next>=0 && next<practiceStates.length){this.practiceIndex=next;return;}
        if(next<0){this.screen='tangram';this.tangramIndex=tangramStates.length-1;return;}
      }
    },
    jump(screen){
      if(screen==='review'){this.screen='review';this.reviewIndex=0;this.reviewStage=0;}
      if(screen==='tangram'){this.screen='tangram';this.tangramIndex=0;}
      if(screen==='practice'){this.screen='practice';this.practiceIndex=0;}
    },
    reset(){this.screen='review';this.reviewIndex=0;this.reviewStage=0;this.tangramIndex=0;this.practiceIndex=0;}
  };
})();

        {transform:`translate(${dx*.90}px,${dy*.88-10}px) rotate(${rot*.18}deg) scale(${scale*1.04})`,opacity:1,offset:.88},
        {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(${scale})`,opacity:0,offset:1}
      ],{duration,delay,easing:'cubic-bezier(.22,.78,.22,1)',fill:'forwards'});

      // 数字在对应图形起飞时才淡出；源图形也保留片刻，学生看得清“第几块去哪儿了”。
      setTimeout(()=>{
        src.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.88)',opacity:.12}],{duration:260,easing:'ease-out',fill:'forwards'});

      },delay+80);

      const done=anim.finished.catch(()=>{}).then(()=>{
        ghost.remove();
        dst.classList.add('piece-landed');
        dst.style.opacity='1';
        dst.animate([
          {transform:'scale(.90)',opacity:.55},
          {transform:'scale(1.09)',opacity:1},
          {transform:'scale(1)',opacity:1}
        ],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'});
      });
      flights.push(done);
    });

    const totalMs=980+(PIECE_ORDER.length-1)*150+380;
    lockNavigation(totalMs);
    Promise.all(flights).then(()=>{
      rack.remove();

      targetCard.classList.remove('assembling-target');

        {transform:'scale(.985)'},{transform:'scale(1.025)'},{transform:'scale(1)'}

      setTimeout(()=>targetCard.classList.remove('assembly-finish'),520);
    });
