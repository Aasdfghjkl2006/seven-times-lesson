  function fullAddition(n){
    if(n<=1) return '7';
    return Array.from({length:n},()=> '7').join('＋') + '＝' + (n*7);
  }
  function ledgerProgress(key){
    const rows=[];
    let current=0, stage='';
    if(key.startsWith('one')){current=1;stage=key.replace('one','');}
    else if(key==='pattern123'){current=3;stage='Complete';}
    else if(key==='summary7'){current=7;stage='Complete';}
    else {
      const m=key.match(/^cat([2-7])(.*)$/);
      if(m){current=Number(m[1]);stage=m[2];}
    }
    const previous = current ? current-1 : 0;
    for(let n=1;n<=previous;n++) rows.push({n,phrase:true,add:true,mul:true,chant:true,current:false});
    if(!current) return rows;
    let phrase=false,add=false,mul=false,chant=false;
    if(current===1){
      phrase=['Phrase','MulStart','MulEach','MulGroups','Multiply','Chant'].includes(stage);
      add=phrase;
      mul=['Multiply','Chant'].includes(stage);
      chant=stage==='Chant';
    }else if(stage==='Complete'){
      phrase=add=mul=chant=true;
    }else{
      const ordered=['Question','Material','Assemble','Phrase','AddFirst','AddSecond','AddBuild','AddSum','Table','MulStart','MulEach','MulGroups','Multiply','ChantBlank','ChantReveal'];
      const idx=ordered.indexOf(stage);
      phrase=idx>=ordered.indexOf('Phrase');
      add=idx>=ordered.indexOf('AddSum');
      mul=idx>=ordered.indexOf('Multiply');
      chant=idx>=ordered.indexOf('ChantReveal');
    }
    if(phrase) rows.push({n:current,phrase,add,mul,chant,current:true});
    return rows;
  }
  function relationLedgerMarkup(key){
    const rows=ledgerProgress(key);
    if(!rows.length) return '';
    const cells=rows.map(r=>{
      const n=r.n,total=n*7;
      const cls=r.current?' ledger-row-current':'';
      const blank='<span class="ledger-empty">—</span>';
      return `
        <div class="ledger-cell ledger-count${cls}">${r.phrase?`${n}个7`:blank}</div>
        <div class="ledger-cell ledger-add${cls}">${r.add?fullAddition(n):blank}</div>
        <div class="ledger-cell ledger-mul${cls}">${r.mul?`7×${n}＝${total}`:blank}</div>
        <div class="ledger-cell ledger-chant${cls}">${r.chant?LESSON_DATA.chants[n]:blank}</div>`;
    }).join('');
    return `<div class="relation-ledger" aria-label="推算记录">
      <div class="ledger-title"><span>推算记录</span></div>
      <div class="ledger-grid">
        <div class="ledger-head">几个7</div><div class="ledger-head">加法</div><div class="ledger-head">乘法</div><div class="ledger-head">口诀</div>
        ${cells}
      </div>
    </div>`;
  }

  function renderTangram(){
    const key=state.tangramStates[state.tangramIndex];
    const main=$('#boardMain'),support=$('#boardSupport'),kicker=$('#boardKicker'),chants=$('#chantGrowth');
    const layout=$('#tangramLayout');
    layout.classList.toggle('is-summary',key==='summary7');
    main.className='board-main';support.textContent='';chants.innerHTML='';
    let currentCount=1,filledCount=1,counter='';
    const m=key.match(/^cat([2-7])/); if(m){ currentCount=Number(m[1]); filledCount=currentCount-1; }

    // Default visual stage per state family.
    // “要不要再添一只”的提问阶段保持原有猫的大小；到材料真正出现时才重新排版、逐步缩小。
    if(key.startsWith('one')) mountStageCats(1,{valueCaptions:['onePhrase','oneMulStart','oneMulEach','oneMulGroups','oneMultiply'].includes(key)});
    else if(m){
      const n=Number(m[1]);
      chants.innerHTML=chantChips(n-1);
      const isQuestion=key===`cat${n}Question`;
      const isMaterial=key===`cat${n}Material`;
      const isAssemble=key===`cat${n}Assemble`;
      const valueCaps=!isQuestion && !isMaterial && !isAssemble;
      if(isQuestion) mountStageCats(n-1,{valueCaptions:false});
      else if(isMaterial || isAssemble) mountStageCats(n,{materialNo:n,assembledMaterial:false,valueCaptions:false});
      else mountStageCats(n,{valueCaptions:valueCaps});
    } else if(key==='pattern123') mountStageCats(3,{valueCaptions:true});

    // Trigger assemble only when newly entering the assemble state.
    if(/^cat[2-7]Assemble$/.test(key) && lastAssembleKey!==key){
      const n=Number(key.match(/^cat([2-7])/)[1]);
      requestAnimationFrame(()=>animateRackToCat(n));
      lastAssembleKey=key;
    }
    if(!/^cat[2-7]Assemble$/.test(key)) lastAssembleKey='';

    switch(key){
      case 'oneQuestion': kicker.textContent='从教材里的1只猫开始';main.textContent='1只猫用了几块七巧板？';counter='1只猫 · 观察';break;
      case 'onePhrase': kicker.textContent='一只猫用一副七巧板';main.innerHTML='<span class="accent-count">1</span>个<span class="accent-seven">7</span>';counter='1只猫 · 1个7';break;
      case 'oneMulStart': kicker.textContent='1个7怎样写成乘法？';main.innerHTML=stepCrossMarkup(1,7,7,'start','one');counter='1只猫 · 准备写乘法';break;
      case 'oneMulEach': kicker.textContent='先写每份的7';main.innerHTML=stepCrossMarkup(1,7,7,'each','one');requestAnimationFrame(()=>animateTangramCross('each'));counter='1只猫 · 7移到前面';break;
      case 'oneMulGroups': kicker.textContent='再写有1份';main.innerHTML=stepCrossMarkup(1,7,7,'groups','one');requestAnimationFrame(()=>animateTangramCross('groups'));counter='1只猫 · 1移到后面';break;
      case 'oneMultiply': kicker.textContent='1个7写成乘法';main.innerHTML=stepCrossMarkup(1,7,7,'final','one');counter='1只猫 · 7×1＝7';break;
      case 'oneChant': kicker.textContent='根据算式编口诀';main.textContent='一七得七';chants.innerHTML=chantChips(1);counter='1只猫 · 口诀';break;
      case 'pattern123': filledCount=3;kicker.textContent='观察表格和猫的变化';main.innerHTML=pattern123Markup();support.textContent='每多1只猫，就多1个7，也就是多7块。';chants.innerHTML=chantChips(3);counter='找规律 · 每次多7';break;
      case 'summary7': filledCount=7;currentCount=7;kicker.textContent='';main.innerHTML='<div>7的乘法口诀 · 推算总结</div>';counter='第二环节 · 总结';break;
    }

    if(m){
      const n=Number(m[1]), total=n*7, prev=(n-1)*7;
      const prefix=`cat${n}`;
      // 在“算出结果”以前，教材表格当前格保持空白；只高亮当前要解决的列。
      filledCount=n-1;
      if(key===`${prefix}Question`){
        kicker.textContent=n<=3?'先想，再动手':`现在有${n-1}只猫，共${prev}块`;
        main.innerHTML=n<=3?`<div class="question-main">再拼第<span class="accent-count">${n}</span>只猫，<br>需要再拿几块？</div>`:`<div class="question-main">再添1只，<br>一共多少块？</div>`;
        counter=`第${n}只猫 · 先预测`;
      }
      if(key===`${prefix}Material`){
        kicker.textContent='先把新拿来的这一副看清楚';
        main.innerHTML=`<div class="question-main">数一数：这一副有<span class="accent-seven">几</span>块？</div>`;
        counter=`第${n}只猫 · 数清7块`;
      }
      if(key===`${prefix}Assemble`){
        kicker.textContent='刚才数清的是同一副7块';
        main.innerHTML=`<div class="question-main">把这<span class="accent-seven">7</span>块<br>拼成第<span class="accent-count">${n}</span>只猫</div>`;
        counter=`第${n}只猫 · 拼合动画`;
      }
      if(key===`${prefix}Phrase`){
        kicker.textContent=`现在有${n}只猫，每只都用7块`;
        main.innerHTML=`<div class="phrase-main"><span class="accent-count">${n}</span>个<span class="accent-seven">7</span></div>`;
        counter=`第${n}只猫 · ${n}个7`;
      }
      if(n===2 && key===`${prefix}AddFirst`){
        kicker.textContent='先把第1只猫的7块放进算式';
        main.innerHTML=catAdditionMarkup(1,false,1);
        requestAnimationFrame(()=>animateCatValueToAddition(1,1));
        counter='第2只猫 · 第1个7';
      }
      if(n===2 && key===`${prefix}AddSecond`){
        kicker.textContent='再把第2只猫的7块放进算式';
        main.innerHTML=catAdditionMarkup(2,false,2);
        requestAnimationFrame(()=>animateCatValueToAddition(2,2));
        counter='第2只猫 · 第2个7';
      }
      if(n===2 && key===`${prefix}AddSum`){
        kicker.textContent='两个7合起来是多少？';
        main.innerHTML=catAdditionMarkup(2,true,0);
        counter='第2只猫 · 7＋7＝14';
      }
      if(n>=3 && key===`${prefix}AddBuild`){
        main.innerHTML=catAdditionMultiMarkup(n,false);
        requestAnimationFrame(()=>animateAllCatValuesToAddition(n));
        counter=`第${n}只猫 · 把${n}个7移进加法算式`;
      }
      if(n>=3 && key===`${prefix}AddSum`){
        main.innerHTML=catAdditionMultiMarkup(n,true);
        $$('.cat-addition-multi .term,.cat-addition-multi .multi-plus').forEach(el=>el.classList.remove('hidden'));
        counter=`第${n}只猫 · ${fullAddition(n)}`;
      }
      if(key===`${prefix}Table`){
        filledCount=n;
        kicker.textContent='结果算出来了，再写回教材表格';
        main.innerHTML=`<div class="table-result"><span class="accent-count">${n}</span>只猫 → <span class="accent-result">${total}</span>块</div>`;
        chants.innerHTML=chantChips(n-1);
        counter=`第${n}只猫 · 表格填${total}`;
      }
      if(key===`${prefix}MulStart`){
        filledCount=n;main.innerHTML=stepCrossMarkup(n,7,total,'start',`cat${n}`);counter=`第${n}只猫 · ${n}个7怎样写成乘法`;
      }
      if(key===`${prefix}MulEach`){
        filledCount=n;main.innerHTML=stepCrossMarkup(n,7,total,'each',`cat${n}`);requestAnimationFrame(()=>animateTangramCross('each'));counter=`第${n}只猫 · 7移到乘号前面`;
      }
      if(key===`${prefix}MulGroups`){
        filledCount=n;main.innerHTML=stepCrossMarkup(n,7,total,'groups',`cat${n}`);requestAnimationFrame(()=>animateTangramCross('groups'));counter=`第${n}只猫 · ${n}移到乘号后面`;
      }
      if(key===`${prefix}Multiply`){
        filledCount=n;
        main.innerHTML=stepCrossMarkup(n,7,total,'final',`cat${n}`);
        chants.innerHTML=chantChips(n-1);counter=`第${n}只猫 · 7×${n}＝${total}`;
      }
      if(key===`${prefix}ChantBlank`){
        filledCount=n;kicker.textContent=`根据7×${n}＝${total}编口诀`;const phrase=LESSON_DATA.chants[n];main.innerHTML=`${phrase.slice(0,2)}<span class="blank" aria-label="留空"></span>`;chants.innerHTML=chantChips(n-1);counter=`第${n}只猫 · 学生编口诀`;

    lastTangramState=key;
  }


  function cubeTokenMarkup(i){

  function twoBySevenPos(i){
    const r=Math.floor(i/7), c=i%7;
    return {x:17+c*10.9,y:r===0?31:68};
  }
  function sevenByTwoPos(i){
    const g=Math.floor(i/2), k=i%2;
    return {x:9.2+g*13.55,y:k===0?40:61};
  }
  function applyCubeLayout(mode,animateFrom){
    const field=$('.cube-field');if(!field)return;
    const cubes=$$('.cube-token',field),shadows=$$('.cube-shadow',field);
    const target=mode==='27'?twoBySevenPos:sevenByTwoPos;
    const start=animateFrom==='27'?twoBySevenPos:animateFrom==='72'?sevenByTwoPos:null;
    cubes.forEach((cube,i)=>{
      const t=target(i), sh=shadows[i];
      if(start){const a=start(i);cube.style.left=`calc(${a.x}% - 19px)`;cube.style.top=`calc(${a.y}% - 19px)`;cube.style.opacity='1';cube.style.transform='translateZ(0) rotateZ(0deg)';sh.style.left=`calc(${a.x}% - 22px)`;sh.style.top=`calc(${a.y}% - 2px)`;sh.style.opacity='.9';}
      else{cube.style.left=`calc(50% - 19px)`;cube.style.top='-54px';cube.style.opacity='0';cube.style.transform=`translateZ(-180px) rotateZ(${(i%2?1:-1)*(18+i*2)}deg)`;sh.style.left='calc(50% - 22px)';sh.style.top='22px';sh.style.opacity='0';}
      cube.style.transitionDelay=`${i*55}ms`;sh.style.transitionDelay=`${i*55}ms`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        cube.style.left=`calc(${t.x}% - 19px)`;cube.style.top=`calc(${t.y}% - 19px)`;cube.style.opacity='1';cube.style.transform='translateZ(0) rotateZ(0deg)';
        sh.style.left=`calc(${t.x}% - 22px)`;sh.style.top=`calc(${t.y}% - 2px)`;sh.style.opacity='.9';
        setTimeout(()=>cube.classList.add('is-settled'),900+i*55);
      }));
    });
  }

  function render(){
    $$('.cross-ghost,.motion-ghost').forEach(el=>el.remove());
    $$('.lesson-screen').forEach(el=>el.classList.toggle('is-active',el.dataset.screen===state.screen));
    $$('[data-lesson-step]').forEach(el=>el.classList.toggle('is-active',el.dataset.lessonStep===state.screen));
    if(state.screen==='review')renderReview();else if(state.screen==='tangram')renderTangram();else renderPractice();
  }
  function next(){if(navLocked)return;state.move(1);render()}
  function prev(){if(navLocked)return;state.move(-1);render()}

  $('#nextState').addEventListener('click',next);$('#prevState').addEventListener('click',prev);
  $('#resetLesson').addEventListener('click',()=>{navLocked=false;clearTimeout(navTimer);$('#nextState').disabled=false;lastFilledCount=1;state.reset();render()});
  $$('[data-lesson-step]').forEach(btn=>btn.addEventListener('click',()=>{state.jump(btn.dataset.lessonStep);render()}));
  $('#openTextbook').addEventListener('click',()=>$('#textbookDialog').showModal());
  $('#closeTextbook').addEventListener('click',()=>$('#textbookDialog').close());
  $('#textbookDialog').addEventListener('click',e=>{if(e.target===$('#textbookDialog'))$('#textbookDialog').close()});
  document.addEventListener('keydown',e=>{
    if($('#textbookDialog').open)return;
    if((e.key==='ArrowRight' || e.key===' ') && !navLocked){e.preventDefault();next();}
    if(e.key==='ArrowLeft' && !navLocked){e.preventDefault();prev();}
  });
  // 开发/验收用：?screen=tangram&step=9 或 ?screen=review&review=0&stage=3
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('screen')==='tangram'){state.screen='tangram';state.tangramIndex=Math.max(0,Math.min(state.tangramStates.length-1,Number(q.get('step')||0)));}
    if(q.get('screen')==='review'){state.screen='review';state.reviewIndex=Math.max(0,Math.min(LESSON_DATA.reviewExamples.length-1,Number(q.get('review')||0)));state.reviewStage=Math.max(0,Math.min(state.getReviewStages(state.reviewIndex).length-1,Number(q.get('stage')||0)));}
    if(q.get('screen')==='practice'){state.screen='practice';state.practiceIndex=Math.max(0,Math.min(state.practiceStates.length-1,Number(q.get('step')||0)));}
  }catch(e){}
  render();
})();

</script>

<script>
// 预览直接展示第2副材料，便于查看本次修复；正式版仍从第1题开始。
if(!location.search){
  LESSON_STATE.screen='tangram';
  LESSON_STATE.tangramIndex=LESSON_STATE.tangramStates.indexOf('cat2Material')-1;
  document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
}
</script>
